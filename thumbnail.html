<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden;}
  .tile{display:flex;width:1280px;height:854px;}
  .main{flex:1;background:#020000;display:flex;align-items:center;justify-content:center;padding:0 80px;}
  .name{font-family:'Bebas Neue','Barlow Condensed',sans-serif;color:#B89E4A;font-size:150px;line-height:0.9;letter-spacing:3px;text-align:center;text-transform:uppercase;}
  .name span{display:block;color:#FFFFFF;font-size:96px;letter-spacing:6px;}
  .strip{width:150px;display:flex;flex-direction:column;}
  .strip>div{flex:1;}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="name">Bish's<span>Nexus</span></div></div>
  <div class="strip">
    <div style="background:#B89E4A;"></div>
    <div style="background:#8B752E;"></div>
    <div style="background:#5E4F1F;"></div>
    <div style="background:#203232;"></div>
  </div>
</div>
</body>
</html>
