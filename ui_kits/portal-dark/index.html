<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Portal Dark" name="Portal (Dark) · UI Kit" subtitle="Interactive click-through: header, tabs, KPIs, unit list, card, composer" viewport="1200x900" -->
<html>
<head>
  <meta charset="UTF-8">
  <title>Bish's RV — Nexus Portal (Dark)</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { background: #020000 !important; margin: 0; padding: 0; color: #fff; font-family: 'Source Sans 3', sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .panel { background: #1C2E2E; border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; overflow: hidden; }
    .panel-head { background: #243838; padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; justify-content: space-between; align-items: center; }
    .panel-head .title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #fff; letter-spacing: 0.5px; }
    .panel-head .eyebrow { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #B89E4A; margin-bottom: 2px; }
    .composer { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; background: #1C2E2E; border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#020000"/><g transform="translate(30 37) scale(0.5)"><path d="M73.5 35.5C73.5 35.5 11.5 58.7 7 61C2.5 63.3 0 57.5 2.5 55C5 52.5 15.5 41.3 15.5 30.5C15.5 19.7 4.7 10.7 3.25 9C0.4 5.8 2 0.3 7 2C12 3.7 61 22 71.5 26C77 28.1 80 31.7 73.5 35.5Z" fill="#B89E4A"/></g></svg></template>
  <div id="root"></div>

  <script src="../../_ds_bundle.js"></script>
  <script>Object.assign(window, window.BishSRVDesignSystem_26feec || {});</script>

  <script type="text/babel">
    const { useState } = React;

    const INITIAL_UNITS = [
      { id: "#4821-B", title: "2024 Winnebago Vista", phase: "Phase 3 · Interior Inspection", status: "Active", statusType: "gold" },
      { id: "#3190-A", title: "2023 Forest River Sandpiper", phase: "Phase 8 · Final QC", status: "Complete", statusType: "success" },
      { id: "#5502-C", title: "2024 Jayco Eagle HT", phase: "Phase 1 · Intake", status: "Pending", statusType: "warning" },
      { id: "#2847-D", title: "2022 Grand Design Reflection", phase: "Phase 5 · Awaiting Parts", status: "Overdue", statusType: "danger" },
      { id: "#6103-A", title: "2025 Thor Chateau", phase: "Phase 2 · Service Review", status: "In Review", statusType: "info" },
    ];

    function App() {
      const [tab, setTab] = useState("Inventory");
      const [selected, setSelected] = useState(INITIAL_UNITS[0]);
      const [stock, setStock] = useState("");
      const [vin, setVin] = useState("");
      const [toast, setToast] = useState(null);

      const vinError = vin.length > 0 && vin.length !== 17 ? "VIN must be exactly 17 characters" : "";

      function addUnit() {
        if (!stock || vin.length !== 17) {
          setToast({ msg: "Fix validation errors before adding", type: "danger" });
        } else {
          setToast({ msg: `Unit ${stock} added to intake queue`, type: "success" });
          setStock(""); setVin("");
        }
        setTimeout(() => setToast(null), 3000);
      }

      return (
        <div>
          <Header />
          <TabBar tabs={["Inventory", "Deals", "Protection Ops", "Pipelines", "Settings"]} active={tab} onChange={setTab} />

          <div className="wrap">
            <div className="stats-grid">
              <StatTile label="Active Units" value="284" delta="+12 this week" deltaType="up" />
              <StatTile label="In Protection" value="47" delta="+3 today" deltaType="up" />
              <StatTile label="Overdue" value="8" delta="-2 since Mon" deltaType="down" />
              <StatTile label="Avg Phase Time" value="4.2d" delta="target: 3.5d" deltaType="neutral" />
            </div>

            <div className="two-col">
              <div className="panel">
                <div className="panel-head">
                  <div>
                    <div className="eyebrow">Active Inventory</div>
                    <div className="title">Units in Protection Ops</div>
                  </div>
                  <Button variant="secondary" size="sm">Export CSV</Button>
                </div>
                <div>
                  {INITIAL_UNITS.map(u => (
                    <UnitRow key={u.id} {...u} onClick={() => setSelected(u)} />
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                <Card title={`Unit ${selected.id}`} subtitle={selected.title} footer={<>
                  <Button variant="ghost" size="sm">Details</Button>
                  <Button variant="primary" size="sm">Continue</Button>
                </>}>
                  <div style={{ marginBottom: 10 }}>
                    <Badge type={selected.statusType}>{selected.status}</Badge>
                  </div>
                  <div>{selected.phase}.</div>
                  <div style={{ marginTop: 8, fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#B89E4A" }}>VIN · 1FBZX2ZM0GKA84720</div>
                </Card>

                <div className="composer">
                  <div className="eyebrow" style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: "#B89E4A" }}>Add to Intake</div>
                  <Input label="Stock Number" value={stock} onChange={setStock} placeholder="RV-2026-001" helper="Auto-generated if blank" />
                  <Input label="VIN" value={vin} onChange={setVin} placeholder="17-character VIN" error={vinError} />
                  <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                    <Button variant="ghost" size="sm" onClick={() => { setStock(""); setVin(""); }}>Clear</Button>
                    <Button variant="primary" size="sm" onClick={addUnit}>Add Unit</Button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {toast && (
            <div style={{
              position: "fixed", bottom: 24, right: 24,
              background: toast.type === "success" ? "rgba(47,158,68,0.15)" : "rgba(224,49,49,0.15)",
              border: `1px solid ${toast.type === "success" ? "rgba(47,158,68,0.35)" : "rgba(224,49,49,0.35)"}`,
              color: toast.type === "success" ? "#51CF66" : "#FF8787",
              fontFamily: "'Barlow Condensed', sans-serif", fontSize: 13, fontWeight: 600,
              letterSpacing: 0.5, padding: "12px 18px", borderRadius: 8, zIndex: 500,
            }}>{toast.msg}</div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
