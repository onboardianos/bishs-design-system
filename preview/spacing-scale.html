<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base, 12-step" viewport="700x320" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;color:#fff;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .tok{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);min-width:70px;background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:3px;border:1px solid var(--border-ghost);}
  .bar{height:16px;background:linear-gradient(90deg,#5E4F1F,#B89E4A);border-radius:2px;}
  .px{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-subtle);}
</style></head>
<body>
  <div class="row"><span class="tok">--sp-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
  <div class="row"><span class="tok">--sp-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row"><span class="tok">--sp-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
  <div class="row"><span class="tok">--sp-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
  <div class="row"><span class="tok">--sp-5</span><div class="bar" style="width:20px"></div><span class="px">20px</span></div>
  <div class="row"><span class="tok">--sp-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
  <div class="row"><span class="tok">--sp-8</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
  <div class="row"><span class="tok">--sp-10</span><div class="bar" style="width:40px"></div><span class="px">40px</span></div>
  <div class="row"><span class="tok">--sp-12</span><div class="bar" style="width:48px"></div><span class="px">48px</span></div>
  <div class="row"><span class="tok">--sp-16</span><div class="bar" style="width:64px"></div><span class="px">64px</span></div>
  <div class="row"><span class="tok">--sp-20</span><div class="bar" style="width:80px"></div><span class="px">80px</span></div>
  <div class="row"><span class="tok">--sp-24</span><div class="bar" style="width:96px"></div><span class="px">96px</span></div>
</body></html>
