<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Text · Light" subtitle="Primary / secondary / tertiary / muted on cream page" viewport="700x110" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#F7F6F1 !important;margin:0;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .sw{border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);background:#FFFFFF;display:flex;align-items:center;padding:10px 12px;gap:10px;}
  .dot{width:28px;height:28px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,0.06);}
  .name{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:#0A0A09;letter-spacing:0.5px;}
  .hex{font-family:'JetBrains Mono',monospace;font-size:10px;color:#6B6B63;margin-top:2px;}
  .role{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:#9C9C94;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="dot" style="background:#0A0A09"></div><div><div class="name">Primary</div><div class="hex">#0A0A09</div><div class="role">Titles</div></div></div>
  <div class="sw"><div class="dot" style="background:#3D3D38"></div><div><div class="name">Secondary</div><div class="hex">#3D3D38</div><div class="role">Body</div></div></div>
  <div class="sw"><div class="dot" style="background:#6B6B63"></div><div><div class="name">Tertiary</div><div class="hex">#6B6B63</div><div class="role">Meta</div></div></div>
  <div class="sw"><div class="dot" style="background:#9C9C94"></div><div><div class="name">Muted</div><div class="hex">#9C9C94</div><div class="role">Subtle</div></div></div>
</div>
</body></html>
