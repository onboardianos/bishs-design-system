<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display Type" subtitle="Bebas Neue — page titles, hero" viewport="700x220" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:24px;color:#fff;}
  .spec{background:var(--surface-card);border:1px solid var(--border-ghost);border-radius:8px;padding:20px 24px;}
  .meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .lab{font-family:var(--font-ui);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent-gold);}
  .var{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
  .xl{font-family:'Bebas Neue',sans-serif;font-size:56px;color:#fff;letter-spacing:2px;line-height:1;}
  .md{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent-gold-hi);letter-spacing:1px;line-height:1;margin-top:8px;}
  .sm{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text-body);letter-spacing:0.5px;line-height:1;margin-top:8px;}
</style></head>
<body>
<div class="spec">
  <div class="meta"><span class="lab">Display · Bebas Neue</span><span class="var">var(--font-display)</span></div>
  <div class="xl">WHERE MEMORIES BEGIN</div>
  <div class="md">INVENTORY · DEALS · PROTECTION</div>
  <div class="sm">ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789</div>
</div>
</body></html>
