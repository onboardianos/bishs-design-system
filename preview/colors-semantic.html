<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Success, Warning, Danger, Info (M3)" viewport="700x140" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sw{border-radius:6px;overflow:hidden;border:1px solid var(--border-ghost);}
  .sw .bars{display:grid;grid-template-columns:1fr 1fr 1fr;height:56px;}
  .sw .meta{background:var(--surface-card);padding:6px 8px;}
  .name{font-family:var(--font-ui);font-size:11px;font-weight:600;color:#fff;letter-spacing:0.5px;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px;}
  .role{font-family:var(--font-ui);font-size:9px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
</style></head>
<body>
<div class="grid">
  <div class="sw">
    <div class="bars"><div style="background:#D3F9D8"></div><div style="background:#2F9E44"></div><div style="background:#1B7A2E"></div></div>
    <div class="meta"><div class="name">Success</div><div class="hex">#2F9E44</div><div class="role">Confirm · Complete</div></div>
  </div>
  <div class="sw">
    <div class="bars"><div style="background:#FFF3BF"></div><div style="background:#F59F00"></div><div style="background:#C77C00"></div></div>
    <div class="meta"><div class="name">Warning</div><div class="hex">#F59F00</div><div class="role">Caution · Pending</div></div>
  </div>
  <div class="sw">
    <div class="bars"><div style="background:#FFE3E3"></div><div style="background:#E03131"></div><div style="background:#B02525"></div></div>
    <div class="meta"><div class="name">Danger</div><div class="hex">#E03131</div><div class="role">Error · Destructive</div></div>
  </div>
  <div class="sw">
    <div class="bars"><div style="background:#D0EBFF"></div><div style="background:#1C7ED6"></div><div style="background:#1864AB"></div></div>
    <div class="meta"><div class="name">Info</div><div class="hex">#1C7ED6</div><div class="role">Info · Link</div></div>
  </div>
</div>
</body></html>
