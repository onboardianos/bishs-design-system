<!DOCTYPE html>
<!-- @dsCard group="Type" name="Body + Mono" subtitle="Source Sans 3 + JetBrains Mono" viewport="700x220" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:24px;color:#fff;}
  .spec{background:var(--surface-card);border:1px solid var(--border-ghost);border-radius:8px;padding:20px 24px;}
  .meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .lab{font-family:var(--font-ui);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent-gold);}
  .var{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
  .lg{font-family:'Source Sans 3',sans-serif;font-size:16px;line-height:1.7;color:var(--text-body);margin-bottom:8px;}
  .md{font-family:'Source Sans 3',sans-serif;font-size:14px;line-height:1.6;color:var(--text-body);margin-bottom:8px;}
  .sm{font-family:'Source Sans 3',sans-serif;font-size:12px;line-height:1.5;color:var(--text-muted);}
  .mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-gold-hi);margin-top:10px;}
</style></head>
<body>
<div class="spec">
  <div class="meta"><span class="lab">Body · Source Sans 3 + Mono</span><span class="var">var(--font-body) / --font-mono</span></div>
  <div class="lg">Body Large — 16px/1.7. Primary content, long-form reading.</div>
  <div class="md">Body Medium — 14px/1.6. Workhorse size for cards, tables, lists.</div>
  <div class="sm">Body Small — 12px/1.5. Captions, helper text, timestamps.</div>
  <div class="mono">const accent = "#8B752E" // VIN: 1FBZX2ZM0GKA84720</div>
</div>
</body></html>
