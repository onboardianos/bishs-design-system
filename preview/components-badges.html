<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges" subtitle="Six semantic pill types" viewport="700x80" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .b{display:inline-flex;align-items:center;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:9999px;}
</style></head>
<body>
<div class="row">
  <span class="b" style="background:rgba(139,117,46,0.15);color:#B89E4A;border:1px solid rgba(139,117,46,0.28);">Active</span>
  <span class="b" style="background:rgba(47,158,68,0.12);color:#2F9E44;border:1px solid rgba(47,158,68,0.3);">Complete</span>
  <span class="b" style="background:rgba(245,159,0,0.12);color:#F59F00;border:1px solid rgba(245,159,0,0.3);">Pending</span>
  <span class="b" style="background:rgba(224,49,49,0.12);color:#E03131;border:1px solid rgba(224,49,49,0.3);">Overdue</span>
  <span class="b" style="background:rgba(28,126,214,0.12);color:#1C7ED6;border:1px solid rgba(28,126,214,0.3);">In Review</span>
  <span class="b" style="background:rgba(255,255,255,0.06);color:#7A7D76;border:1px solid rgba(255,255,255,0.13);">Draft</span>
</div>
</body></html>
