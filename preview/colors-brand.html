<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand Palette" subtitle="Six-color heritage palette" viewport="700x140" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .sw{border-radius:6px;overflow:hidden;border:1px solid var(--border-ghost);}
  .sw .color{height:64px;}
  .sw .meta{background:var(--surface-card);padding:6px 8px;}
  .name{font-family:var(--font-ui);font-size:11px;font-weight:600;color:#fff;letter-spacing:0.5px;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px;}
  .role{font-family:var(--font-ui);font-size:9px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="color" style="background:#020000;border:1px solid #111"></div><div class="meta"><div class="name">Black</div><div class="hex">#020000</div><div class="role">Surface · Page</div></div></div>
  <div class="sw"><div class="color" style="background:#203232"></div><div class="meta"><div class="name">Dark Green</div><div class="hex">#203232</div><div class="role">Surface · Card</div></div></div>
  <div class="sw"><div class="color" style="background:#8B752E"></div><div class="meta"><div class="name">Gold</div><div class="hex">#8B752E</div><div class="role">Accent · CTA</div></div></div>
  <div class="sw"><div class="color" style="background:#E7DDB4"></div><div class="meta"><div class="name">Cream</div><div class="hex">#E7DDB4</div><div class="role">Text · Body</div></div></div>
  <div class="sw"><div class="color" style="background:#545750"></div><div class="meta"><div class="name">Olive</div><div class="hex">#545750</div><div class="role">Accent · Secondary</div></div></div>
  <div class="sw"><div class="color" style="background:#FFFFFF"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div><div class="role">Text · Heading</div></div></div>
</div>
</body></html>
