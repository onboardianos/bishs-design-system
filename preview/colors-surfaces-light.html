<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Surfaces · Light" subtitle="4 light surfaces (page → inset → raised → card) — elevation via shadow" viewport="700x160" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#F7F6F1 !important;margin:0;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .sw{border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);}
  .sw .color{height:64px;}
  .sw .meta{background:#FFFFFF;padding:6px 8px;}
  .name{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:#0A0A09;letter-spacing:0.5px;}
  .hex{font-family:'JetBrains Mono',monospace;font-size:10px;color:#6B6B63;margin-top:2px;}
  .role{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:#9C9C94;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="color" style="background:#F7F6F1;border-bottom:1px solid rgba(0,0,0,0.08);"></div><div class="meta"><div class="name">Page</div><div class="hex">#F7F6F1</div><div class="role">Level 0 · warm cream</div></div></div>
  <div class="sw"><div class="color" style="background:#EFEDE4"></div><div class="meta"><div class="name">Inset</div><div class="hex">#EFEDE4</div><div class="role">Recessed</div></div></div>
  <div class="sw"><div class="color" style="background:#FAFAF6;border-bottom:1px solid rgba(0,0,0,0.08);"></div><div class="meta"><div class="name">Raised</div><div class="hex">#FAFAF6</div><div class="role">Level 1</div></div></div>
  <div class="sw"><div class="color" style="background:#FFFFFF;border-bottom:1px solid rgba(0,0,0,0.08);"></div><div class="meta"><div class="name">Card</div><div class="hex">#FFFFFF</div><div class="role">Level 2 · elevation via shadow</div></div></div>
</div>
</body></html>
