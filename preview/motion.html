<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Motion" subtitle="Fast / Normal / Slow durations" viewport="700x180" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;color:#fff;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .item{background:#1C2E2E;border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:18px;text-align:center;}
  .dot{width:36px;height:36px;border-radius:50%;background:#8B752E;margin:0 auto 10px;}
  .n{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:500;color:#fff;letter-spacing:0.5px;}
  .d{font-family:'JetBrains Mono',monospace;font-size:11px;color:#B89E4A;margin-top:4px;}
  .u{font-family:'Source Sans 3',sans-serif;font-size:11px;color:#7A7D76;margin-top:4px;line-height:1.4;}
</style></head>
<body>
<div class="grid">
  <div class="item"><div class="dot"></div><div class="n">Fast</div><div class="d">150ms</div><div class="u">Toggles, hover states</div></div>
  <div class="item"><div class="dot"></div><div class="n">Normal</div><div class="d">250ms</div><div class="u">Dropdowns, panels</div></div>
  <div class="item"><div class="dot"></div><div class="n">Slow</div><div class="d">350ms</div><div class="u">Modals, page transitions</div></div>
</div>
</body></html>
