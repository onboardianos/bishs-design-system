<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons · Light" subtitle="Primary / secondary / ghost / danger on light surfaces" viewport="700x250" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#F7F6F1 !important;margin:0;padding:20px;}
  .btn{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:0.5px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;height:40px;padding:8px 16px;font-size:13px;border:none;}
  .primary{background:#8B752E;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.06);}
  .primary:hover{background:#B89E4A;}
  .secondary{background:#FFFFFF;color:#5E4F1F;border:1px solid rgba(139,117,46,0.45);}
  .ghost{background:transparent;color:#3D3D38;border:none;}
  .danger{background:#B02525;color:#fff;border:none;}
  .disabled{background:#EFEDE4;color:#9C9C94;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .lab{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#6B6B63;width:80px;}
</style></head>
<body>
<div class="row"><span class="lab">Primary</span><button class="btn primary">Continue</button><button class="btn primary" style="height:32px;padding:6px 12px;font-size:12px;">Small</button><button class="btn primary" style="height:48px;padding:10px 24px;font-size:14px;">Send to Lender</button><button class="btn disabled">Disabled</button></div>
<div class="row"><span class="lab">Secondary</span><button class="btn secondary">Details</button><button class="btn secondary" style="height:32px;padding:6px 12px;font-size:12px;">Edit</button></div>
<div class="row"><span class="lab">Ghost</span><button class="btn ghost">Cancel</button><button class="btn ghost" style="height:32px;padding:6px 12px;font-size:12px;">Skip</button></div>
<div class="row"><span class="lab">Danger</span><button class="btn danger">Delete Unit</button></div>
</body></html>
