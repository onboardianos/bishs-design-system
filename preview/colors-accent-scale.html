<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Accent Scale" subtitle="Gold + Olive tonal ramp" viewport="700x140" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .sw{border-radius:6px;overflow:hidden;border:1px solid var(--border-ghost);}
  .sw .color{height:64px;}
  .sw .meta{background:var(--surface-card);padding:6px 8px;}
  .name{font-family:var(--font-ui);font-size:11px;font-weight:600;color:#fff;letter-spacing:0.5px;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px;}
  .role{font-family:var(--font-ui);font-size:9px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="color" style="background:#5E4F1F"></div><div class="meta"><div class="name">Gold Lo</div><div class="hex">#5E4F1F</div><div class="role">Gradient Start</div></div></div>
  <div class="sw"><div class="color" style="background:#8B752E"></div><div class="meta"><div class="name">Gold</div><div class="hex">#8B752E</div><div class="role">Primary Accent</div></div></div>
  <div class="sw"><div class="color" style="background:#B89E4A"></div><div class="meta"><div class="name">Gold Hi</div><div class="hex">#B89E4A</div><div class="role">Highlight · Active</div></div></div>
  <div class="sw"><div class="color" style="background:#545750"></div><div class="meta"><div class="name">Olive</div><div class="hex">#545750</div><div class="role">Secondary</div></div></div>
  <div class="sw"><div class="color" style="background:#6E7268"></div><div class="meta"><div class="name">Olive Hi</div><div class="hex">#6E7268</div><div class="role">Secondary Hi</div></div></div>
</div>
</body></html>
