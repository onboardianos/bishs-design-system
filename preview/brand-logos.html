<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Variations" subtitle="Gold · Black · White + tagline on paired surfaces" viewport="700x320" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .tile{aspect-ratio:1.6;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:12px;}
  .tile img{max-width:100%;max-height:100%;object-fit:contain;}
  .cap{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7A7D76;margin-top:4px;text-align:center;}
</style></head>
<body>
<div class="grid">
  <div><div class="tile" style="background:#020000;border:1px solid #222"><img src="../assets/logo-tag-gold.png"></div><div class="cap">Gold on Black</div></div>
  <div><div class="tile" style="background:#F7F6F1"><img src="../assets/logo-tag-black.png"></div><div class="cap">Black on Cream</div></div>
  <div><div class="tile" style="background:#203232"><img src="../assets/logo-tag-white.png"></div><div class="cap">White on Green</div></div>
  <div><div class="tile" style="background:#020000;border:1px solid #222"><img src="../assets/logo-tag-gold-white.png"></div><div class="cap">Gold/White</div></div>
  <div><div class="tile" style="background:#8B752E"><img src="../assets/logo-tag-black-white.png"></div><div class="cap">Black/White on Gold</div></div>
  <div><div class="tile" style="background:#FFFFFF"><img src="../assets/logo-tag-gold-black.png"></div><div class="cap">Gold/Black on White</div></div>
</div>
</body></html>
