<!DOCTYPE html>
<!-- @dsCard group="Components" name="Inputs" subtitle="Default, focus, error, disabled" viewport="700x220" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;color:#fff;}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .f{}
  label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.5px;margin-bottom:4px;color:#E7DDB4;}
  input{font-family:'Source Sans 3',sans-serif;font-size:14px;width:100%;padding:10px 12px;background:#111E1E;color:#fff;border:1px solid rgba(255,255,255,0.13);border-radius:8px;outline:none;box-sizing:border-box;}
  .err input{border-color:#E03131;box-shadow:0 0 0 3px rgba(224,49,49,0.15);}
  .err label{color:#E03131;}
  .err .hint{color:#E03131;}
  .focus input{border-color:#B89E4A;box-shadow:0 0 0 3px rgba(139,117,46,0.15);}
  .hint{font-family:'Source Sans 3',sans-serif;font-size:12px;color:#7A7D76;margin-top:4px;}
  .dis input{background:#0A1414;color:#4A4D46;border-color:rgba(255,255,255,0.07);cursor:not-allowed;}
</style></head>
<body>
<div class="wrap">
  <div class="f"><label>Stock Number</label><input value="RV-2026-4821"><div class="hint">17-character unit ID</div></div>
  <div class="f focus"><label>VIN (focus)</label><input value="1FBZX2ZM0GKA84720"><div class="hint">Lender sync required</div></div>
  <div class="f err"><label>VIN (error)</label><input value="abc123"><div class="hint">VIN must be exactly 17 characters</div></div>
  <div class="f dis"><label>Locked Value</label><input value="Deal DL-0892" disabled></div>
</div>
</body></html>
