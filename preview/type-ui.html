<!DOCTYPE html>
<!-- @dsCard group="Type" name="UI Type" subtitle="Barlow Condensed — nav, labels, overlines" viewport="700x200" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:24px;color:#fff;}
  .spec{background:var(--surface-card);border:1px solid var(--border-ghost);border-radius:8px;padding:20px 24px;}
  .meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .lab{font-family:var(--font-ui);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent-gold);}
  .var{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
  .r1{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;letter-spacing:0.5px;color:#fff;margin-bottom:8px;}
  .r2{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.5px;color:var(--text-body);margin-bottom:10px;}
  .r3{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent-gold);margin-bottom:6px;}
  .r4{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);}
</style></head>
<body>
<div class="spec">
  <div class="meta"><span class="lab">UI · Barlow Condensed</span><span class="var">var(--font-ui)</span></div>
  <div class="r1">Section Title — Semibold 20px</div>
  <div class="r2">Card Title — Medium 14px — Component headings and nav labels</div>
  <div class="r3">LABEL · 11PX SEMIBOLD · TRACKING 3PX</div>
  <div class="r4">OVERLINE · 10PX REGULAR · TRACKING 2PX</div>
</div>
</body></html>
