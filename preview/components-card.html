<!DOCTYPE html>
<!-- @dsCard group="Components" name="Card · Dark" subtitle="Three-part card on dark green with ghost border" viewport="560x230" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:#020000 !important;margin:0;padding:20px;}
  .card{background:#1C2E2E;border:1px solid rgba(255,255,255,0.07);border-radius:8px;overflow:hidden;width:360px;}
  .head{background:#243838;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07);}
  .t{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:0.5px;}
  .sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:#7A7D76;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
  .body{padding:14px 18px;}
  .body p{font-family:'Source Sans 3',sans-serif;font-size:13px;color:#E7DDB4;line-height:1.6;margin:0;}
  .foot{padding:10px 18px;border-top:1px solid rgba(255,255,255,0.07);display:flex;justify-content:flex-end;gap:8px;}
  .btn{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:0.5px;padding:6px 12px;border-radius:6px;border:none;cursor:pointer;}
  .ghost{background:transparent;color:#E7DDB4;}
  .primary{background:#8B752E;color:#fff;}
</style></head>
<body>
<div class="card">
  <div class="head"><div class="t">Unit #4821-B</div><div class="sub">2024 Winnebago Vista · Class A</div></div>
  <div class="body"><p>Protection operations checklist is 67% complete. 4 tasks remaining in Phase 3 — Interior Inspection.</p></div>
  <div class="foot"><button class="btn ghost">Details</button><button class="btn primary">Continue</button></div>
</div>
</body></html>
