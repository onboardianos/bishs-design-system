<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP · Your 3 + 1 · converted to Bish's OS</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
html,body{margin:0;height:100%;background:var(--surface-deep);font-family:var(--font-body);}
a{color:var(--accent-gold-lo);}a:hover{color:var(--accent-gold);}
.mc-app :is(h1,h2,h3,p,dt,dd,li,ol,ul){color:inherit;}

.mc{container-type:inline-size;container-name:mc;display:grid;gap:16px;min-height:100%;box-sizing:border-box;padding:clamp(12px,2vw,20px);background:var(--surface-light-page);color:var(--text-light-primary);align-items:start;}
.mc-mono{font-family:var(--font-mono);}
.mc-ov{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent-olive);margin:0 0 4px;}
.mc-ov.dark{color:var(--accent-gold-hi);letter-spacing:1.5px;}
.mc-lbl{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-light-secondary);}
.mc-h1{margin:4px 0 2px;font-family:var(--font-display);font-weight:400;font-size:clamp(30px,5cqi,44px);letter-spacing:.5px;line-height:1;}
.mc-h2{margin:2px 0 0;font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3cqi,32px);letter-spacing:.5px;line-height:1;}
.mc-h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.5px;line-height:1;}
.mc-sub{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-tertiary);margin-top:4px;}
.mc-p{font-size:14px;line-height:1.5;color:var(--text-light-secondary);}
.mc-panel{display:flex;flex-direction:column;gap:14px;background:var(--surface-light-card);border:1px solid var(--border-light);border-radius:12px;padding:18px;box-shadow:var(--shadow-sm);min-width:0;}
.mc-situation{min-height:0;}
.mc-sheet .mc-situation,.mc-sheet .mc-slots{position:static;max-height:none;border:none;box-shadow:none;padding:0;}
.mc-rail{position:sticky;top:0;display:flex;justify-content:center;padding-top:4px;}
.mc-stack{display:flex;flex-direction:column;gap:12px;min-width:0;}
.mc-card{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border-light);border-radius:12px;background:var(--surface-light-card);}
.mc-card-h{display:flex;align-items:center;gap:10px;}
.mc-card-h h3{margin:0;flex:1;font-family:var(--font-ui);font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.mc-card-ic{width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:var(--surface-light-inset);display:grid;place-items:center;color:var(--text-light-secondary);}
.mc-card-meta{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-light-secondary);}
.mc-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;}
.mc-trio>div{border:1px solid var(--border-light-mid);border-radius:8px;padding:8px 6px;text-align:center;}
.mc-trio dt{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-light-secondary)!important;}
.mc-trio dd{margin:2px 0 0;font-family:var(--font-mono);font-size:16px;color:var(--text-light-primary);}
.mc-tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0;}
.mc-tags li{padding:6px 12px;border:1px solid var(--border-light-mid);border-radius:6px;font-size:14px;}
.mc-tags--ui li{border:none;border-radius:999px;background:var(--surface-light-inset);font-family:var(--font-ui);font-weight:700;letter-spacing:.5px;}
.mc-rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:16px;}
.mc-rank b{display:inline-block;width:24px;font-family:var(--font-mono);color:var(--accent-olive);}
.mc-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:10px;background:var(--surface-light-inset);}
.mc-seg button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;border:none;border-radius:7px;background:transparent;font-family:var(--font-ui);font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-secondary);cursor:pointer;white-space:nowrap;}
.mc-seg button[aria-selected="true"]{background:var(--surface-light-card);color:var(--text-light-primary);box-shadow:var(--shadow-sm);}
.mc-seg--pill{grid-auto-columns:auto;border-radius:999px;background:var(--surface-light-card);border:1px solid var(--border-light-mid);}
.mc-seg--pill button{border-radius:999px;}
.mc-seg--pill button[aria-selected="true"]{background:var(--text-light-primary);color:var(--brand-white);box-shadow:none;}
.mc-count{min-width:22px;height:22px;border-radius:999px;display:inline-grid;place-items:center;font-family:var(--font-mono);font-size:12px;background:var(--text-light-primary);color:var(--brand-white);letter-spacing:0;}
.mc-badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--text-light-primary);color:var(--brand-white);font-family:var(--font-mono);font-size:12px;font-weight:700;}
.mc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:transparent;font-family:var(--font-ui);font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;color:var(--text-light-primary);box-sizing:border-box;}
.mc-btn:focus-visible,.mc-icon-btn:focus-visible,.mc-seg button:focus-visible,.mc-chip:focus-visible,.mc-row-title:focus-visible,.mc-menuitem:focus-visible{outline:2px solid var(--accent-gold-hi);outline-offset:2px;}
.mc-btn--sm{padding:0 12px;font-size:14px;}
.mc-btn--commit{background:var(--accent-gold-hi);color:var(--brand-black);font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:1.5px;}
.mc-btn--commit:hover{background:var(--accent-gold);}
.mc-btn--action{border-color:var(--accent-gold);color:var(--accent-gold-lo);background:var(--surface-light-card);}
.mc-btn--action:hover{background:var(--surface-light-inset);}
.mc-btn--quiet{border-color:var(--border-input-light);color:var(--text-light-secondary);background:var(--surface-light-card);}
.mc-btn--quiet:hover{background:var(--surface-light-inset);color:var(--text-light-primary);}
.mc-btn--sel{min-width:132px;border-color:var(--border-input-light);background:var(--surface-light-card);}
.mc-btn--sel:hover{background:var(--surface-light-inset);}
.mc-btn--sel.on{border-color:var(--text-light-primary);background:var(--surface-light-inset);}
.mc-btn:disabled{cursor:not-allowed;background:var(--surface-light-inset);color:var(--text-light-muted);border-color:var(--border-light);}
.mc-icon-btn{width:44px;height:44px;flex:0 0 44px;display:inline-grid;place-items:center;border:none;border-radius:8px;background:transparent;color:var(--text-light-secondary);cursor:pointer;}
.mc-icon-btn:hover{background:var(--surface-light-inset);}
.mc-icon-btn--box{border:1px solid var(--border-input-light);}
.mc-chips{display:flex;flex-wrap:wrap;gap:6px;}
.mc-chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border-input-light);background:var(--surface-light-card);font-family:var(--font-ui);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-light-secondary);cursor:pointer;}
.mc-chip[aria-pressed="true"]{background:var(--text-light-primary);border-color:var(--text-light-primary);color:var(--brand-white);}
.mc-input{min-height:44px;width:100%;box-sizing:border-box;padding:0 12px;border:1px solid var(--border-input-light);border-radius:8px;background:var(--surface-light-card);font-family:var(--font-body);font-size:16px;color:var(--text-light-primary);}
.mc-input:focus{outline:none;border-color:var(--accent-gold);box-shadow:0 0 0 3px rgba(139,117,46,.15);}
.mc-field-l{display:flex;flex-direction:column;gap:6px;}
.mc-range{display:flex;flex-direction:column;gap:4px;}
.mc-range input{width:100%;min-height:44px;accent-color:var(--text-light-primary);}
.mc-check{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding-right:8px;font-family:var(--font-mono);font-size:14px;cursor:pointer;}
.mc-check input{width:20px;height:20px;accent-color:var(--text-light-primary);}
.mc-field{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid var(--border-input-light);border-radius:8px;background:var(--surface-light-card);color:var(--text-light-tertiary);}
.mc-field:focus-within{border-color:var(--accent-gold);box-shadow:0 0 0 3px rgba(139,117,46,.15);}
.mc-field input,.mc-field select{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--font-body);font-size:15px;color:var(--text-light-primary);height:42px;appearance:none;}
.mc-center{display:flex;flex-direction:column;gap:14px;min-width:0;}
.mc-brief{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;}
.mc-brief-t{flex:1 1 420px;margin:0;padding:12px 18px;border:1px solid var(--border-light);border-left:4px solid var(--accent-olive);border-radius:10px;background:var(--surface-light-card);font-size:16px;line-height:1.5;color:var(--text-light-secondary);}
.mc-brief-t b{color:var(--text-light-primary);}
.mc-clock{display:flex;align-items:baseline;gap:8px;font-family:var(--font-mono);font-size:14px;color:var(--text-light-secondary);}
.mc-clock b{font-size:18px;color:var(--text-light-primary);}
.mc-deal{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:14px;background:#141414;color:var(--brand-white);}
.mc-deal-sum{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 4px;border:none;background:transparent;color:var(--brand-white);font-size:14px;cursor:pointer;text-align:left;}
.mc-deal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;align-items:end;}
.mc-deal-f{display:flex;flex-direction:column;gap:2px;min-width:0;}
.mc-deal-in{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border-radius:8px;background:var(--brand-white);color:var(--text-light-tertiary);}
.mc-deal-in i{font-style:normal;font-family:var(--font-mono);font-size:12px;}
.mc-deal-in input{flex:1;min-width:0;border:none;outline:none;background:transparent;text-align:center;font-family:var(--font-mono);font-size:17px;color:var(--text-light-primary);height:42px;}
.mc-deal-in:focus-within{box-shadow:0 0 0 3px var(--accent-gold-hi);}
.mc-deal-chk{flex-direction:row;align-items:center;gap:10px;min-height:44px;}
.mc-deal-chk input{width:22px;height:22px;accent-color:var(--accent-gold-hi);}
.mc-crit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.mc-crit-chip{padding:4px 10px;border:1px solid var(--border-mid);border-radius:6px;font-family:var(--font-mono);font-size:13px;color:var(--brand-white);}
.mc-crit-chip b{font-family:var(--font-ui);letter-spacing:1.5px;text-transform:uppercase;color:var(--brand-cream);margin-right:4px;}
.mc-results{display:flex;flex-direction:column;gap:12px;min-width:0;}
.mc-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.mc-table{background:var(--surface-light-card);border:1px solid var(--border-light);border-radius:12px;overflow:hidden;}
.mc-thead{display:none;}
.mc-group{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 16px;background:var(--surface-light-raised);border-bottom:1px solid var(--border-light);font-size:13px;color:var(--text-light-secondary);}
.mc-rows{list-style:none;margin:0;padding:0;}
.mc-row{display:grid;grid-template-columns:24px 44px minmax(0,1fr);grid-template-areas:"grip lead main" "grip nums nums" "grip act act";gap:8px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border-light);background:var(--surface-light-card);}
.mc-row:last-child{border-bottom:none;}
.mc-row[draggable="true"]{cursor:grab;}
.mc-row.is-sel{background:var(--surface-light-inset);box-shadow:inset 4px 0 0 var(--text-light-primary);}
.mc-row.is-group{background:var(--surface-light-raised);}
.mc-row.is-drag{opacity:.45;}
.mc-grip{grid-area:grip;color:var(--text-light-tertiary);display:grid;place-items:center;}
.mc-row>.mc-icon-btn,.mc-row>.mc-thumb{grid-area:lead;}
.mc-thumb{width:44px;height:34px;border-radius:6px;background:var(--surface-light-inset);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;}
.mc-thumb img{width:100%;height:100%;object-fit:contain;}
.mc-row-main{grid-area:main;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;}
.mc-row-title{padding:0;border:none;background:none;text-align:left;cursor:pointer;font-family:var(--font-display);font-size:clamp(20px,2.4cqi,24px);letter-spacing:.8px;line-height:1.1;color:var(--text-light-primary);min-height:28px;}
.mc-row-title:hover{text-decoration:underline;text-underline-offset:3px;}
.mc-row-tags{display:flex;flex-wrap:wrap;gap:6px;}
.mc-tag{padding:2px 8px;border-radius:4px;background:var(--surface-light-inset);border:1px solid var(--border-light-mid);font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-secondary);}
.mc-tag.ink{background:var(--text-light-primary);border-color:var(--text-light-primary);color:var(--brand-white);}
.mc-row-sub{flex-basis:100%;font-size:13px;color:var(--text-light-tertiary);}
.mc-reasons{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:2px 0 0;padding:0;}
.mc-reasons li{padding:2px 8px;border-radius:4px;background:var(--surface-light-inset);font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-primary);}
.mc-row-nums{grid-area:nums;display:grid;grid-template-columns:repeat(4,minmax(0,auto));justify-content:space-between;gap:8px;margin:0;}
.mc-row-nums dt{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-tertiary)!important;}
.mc-row-nums dd{margin:0;font-size:14px;}
.mc-pay dd{display:flex;align-items:center;gap:6px;}
.mc-pay b{font-size:16px;}
.mc-fit{padding:2px 6px;border-radius:4px;font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.mc-fit.ok{background:var(--semantic-success-light);color:var(--semantic-success-dark);}
.mc-fit.over{background:var(--semantic-danger-light);color:var(--semantic-danger-dark);}
.mc-row>.mc-btn--sel{grid-area:act;justify-self:stretch;}
.mc-row-more{grid-column:2 / -1;padding:8px 12px;border-radius:8px;background:var(--surface-light-card);border:1px dashed var(--border-input-light);font-size:13px;color:var(--text-light-secondary);}
.mc-empty{margin:0;padding:24px 16px;font-size:14px;font-style:italic;color:var(--text-light-tertiary);}
@container mc (min-width: 820px){
.mc-thead{display:grid;grid-template-columns:24px 44px minmax(0,1fr) 64px 68px 92px 168px 140px;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border-light);background:var(--surface-light-raised);font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-light-secondary);}
.mc-row{grid-template-columns:24px 44px minmax(0,1fr) auto 140px;grid-template-areas:"grip lead main nums act";}
.mc-row-nums{grid-template-columns:64px 68px 92px 168px;gap:12px;justify-content:start;}
.mc-row-nums dt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.mc-row>.mc-btn--sel{justify-self:end;}
}
.mc-slots{display:flex;flex-direction:column;gap:12px;position:sticky;top:0;min-width:0;}
.mc-slot-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.mc-slot{display:flex;flex-direction:column;gap:8px;min-height:56px;padding:12px 14px;border:1.5px dashed var(--border-input-light);border-radius:12px;background:transparent;}
.mc-slot.is-full{border-style:solid;border-color:var(--border-light-mid);background:var(--surface-light-card);box-shadow:var(--shadow-sm);}
.mc-slot.is-target{border:2px dashed var(--text-light-primary);background:var(--surface-light-inset);}
.mc-slot-h{display:flex;align-items:center;justify-content:space-between;min-height:24px;margin:-6px -8px -6px 0;}
.mc-slot-t{font-family:var(--font-ui);font-size:17px;font-weight:700;line-height:1.2;}
.mc-slot-p{font-size:14px;margin:2px 0;}
.mc-drop{font-family:var(--font-display);font-size:20px;letter-spacing:1px;color:var(--text-light-primary);}
.mc-slot-foot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--border-light);}
.mc-dock{position:absolute;left:0;right:0;bottom:80px;z-index:40;display:flex;gap:8px;padding:10px 12px;background:var(--surface-light-card);border-top:1px solid var(--border-light);box-shadow:0 -6px 20px rgba(0,0,0,.08);}
.mc-scrim{position:absolute;inset:0;z-index:90;display:flex;justify-content:center;background:rgba(2,0,0,.55);box-sizing:border-box;}
.mc-dialog{width:100%;max-width:1000px;max-height:100%;display:flex;flex-direction:column;background:var(--surface-light-card);color:var(--text-light-primary);border-radius:16px;box-shadow:var(--shadow-xl);overflow:hidden;container-type:inline-size;}
.mc-detail-body{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:20px 24px;}
@container (min-width: 720px){.mc-detail-body{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);}}
.mc-photo{aspect-ratio:3/2;border-radius:12px;background:var(--surface-light-inset);display:grid;place-items:center;overflow:hidden;}
.mc-photo img{width:80%;height:80%;object-fit:contain;}
.mc-kvs{margin:0;}
.mc-kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-light);}
.mc-kv dt{font-size:16px;white-space:nowrap;color:var(--text-light-secondary)!important;}
.mc-kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:16px;text-align:right;}
.mc-detail-body>*{min-width:0;}
.mc-menu{background:var(--surface-light-card);color:var(--text-light-primary);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;box-sizing:border-box;}
.mc-menuitem{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 12px;border:none;border-radius:8px;background:transparent;font-family:var(--font-body);font-size:15px;color:inherit;cursor:pointer;text-align:left;}
.mc-menuitem:hover{background:var(--surface-light-inset);}
.mc-menuitem:disabled{color:var(--text-light-muted);cursor:not-allowed;}
.mc-sheet{display:flex;flex-direction:column;gap:12px;background:var(--surface-light-page);color:var(--text-light-primary);padding:18px;box-sizing:border-box;overflow-y:auto;box-shadow:var(--shadow-xl);}
.mc-toast{position:absolute;left:50%;transform:translateX(-50%);z-index:95;max-width:calc(100% - 32px);padding:12px 18px;border-radius:10px;background:var(--brand-black);color:var(--brand-white);font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
.h-btn{min-height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--border-mid);background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;}
.h-btn[aria-pressed="true"]{border-color:var(--accent-gold-hi);color:var(--accent-gold-hi);}
.h-row{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:none;border-radius:6px;background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:14px;cursor:pointer;text-align:left;}
.h-row[aria-current="true"]{background:rgba(184,158,74,.14);color:var(--accent-gold-hi);}
.h-row.key{color:var(--text-body);}
.h-lab{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="mcp-data.babel"></script>
<script type="text/babel" src="mcp-screen.babel"></script>
<script type="text/babel" src="mcp-app.babel"></script>
<script type="text/babel">
const STATES = window.MCP_STATES;
const DEVICES = [['fill', 'Fill', null], ['wide', 'Wide', 1920], ['desktop', 'Desktop', 1280], ['tablet', 'Tablet', 834], ['phone', 'Phone', 390]];
const NAV_KEY = 'mcp-conversion-nav';
async function exportHandoff(onProgress) {
  const L = window.BishSRVDesignSystem_26feec.SpecLint, snaps = [];
  for (const role of Object.keys(window.MCP.ROLES)) for (const st of STATES) for (const w of [1440, 834, 390]) {
    onProgress(`${role} · ${st.label} · ${w}`);
    const host = document.createElement('div'); host.style.cssText = `position:fixed;left:-20000px;top:0;width:${w}px;height:900px;`; document.body.appendChild(host);
    const root = ReactDOM.createRoot(host); root.render(<window.MCPApp initial={st.initial} role={role} />);
    await new Promise((r) => setTimeout(r, 450));
    snaps.push(L.snapshot(host, { state: `${role}:${st.id}`, width: w, label: `${window.MCP.ROLES[role]} · ${st.label}`, status: 'mvp' }));
    root.unmount(); host.remove();
  }
  const man = L.manifest('MCP', snaps);
  L.download('mcp.manifest.json', JSON.stringify(man, null, 2));
  L.download('mcp.requirements.md', L.requirements(man, {}), 'text/markdown');
  let precedents = []; try { precedents = await (await fetch('../../documents/precedents/precedents.json')).json(); } catch (e) {}
  const t = L.tickets(man, {}, { intake: { rules: {} }, ruleMap: {}, precedents, questions: [] });
  L.download('mcp.jira-tickets.csv', t.csv, 'text/csv');
  return man;
}
function Artboard({ state, w, h, role = 'manager' }) {
  return (
    <figure data-spec-id={`frame-artboard#${role}-${state.id}-${w}`} style={{ margin: 0, display: 'flex', flexDirection: 'column', gap: 8, flex: '0 0 auto' }}>
      <figcaption style={{ fontFamily: 'var(--font-ui)', fontSize: 13, fontWeight: 600, letterSpacing: 0.5, color: 'var(--text-body)' }}>{state.label} · {w}{role !== 'manager' ? ` · ${window.MCP.ROLES[role]}` : ''}{state.figma ? <span style={{ color: 'var(--text-muted)', fontWeight: 400 }}> · Figma: {state.figma}</span> : null}</figcaption>
      <div style={{ width: w, height: h, borderRadius: 10, overflow: 'hidden', border: '1px solid var(--border-mid)', background: 'var(--surface-light-page)' }}><window.MCPApp initial={state.initial} role={role} /></div>
    </figure>
  );
}
function Canvas() {
  const S = (id) => STATES.find((s) => s.id === id);
  const sec = (label, items) => (
    <section data-spec-id={`sec-canvas-${label.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <h2 style={{ margin: 0, fontFamily: 'var(--font-ui)', fontSize: 13, fontWeight: 700, letterSpacing: 3, textTransform: 'uppercase', color: 'var(--accent-gold-hi)' }}>{label}</h2>
      <div style={{ display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}>{items}</div>
    </section>
  );
  return (
    <div style={{ padding: 32, display: 'flex', flexDirection: 'column', gap: 40, overflow: 'auto', height: '100%', boxSizing: 'border-box' }}>
      {sec('Postures · picks placed', [<Artboard key="w" state={S('picks-placed')} w={1920} h={1100} />, <Artboard key="d" state={S('picks-placed')} w={1280} h={900} />, <Artboard key="t" state={S('picks-placed')} w={834} h={1100} />, <Artboard key="p" state={S('picks-placed')} w={390} h={844} />])}
      {sec('Build the 3 + 1', ['empty', 'filters', 'shortlist', 'one-selected', 'one-placed', 'dragging', 'picks-placed', 'selected-view', 'sent', 'collapsed'].map((id) => <Artboard key={id} state={S(id)} w={1440} h={900} />))}
      {sec('Overlays', ['unit-detail', 'place-menu', 'slot-menu'].map((id) => <Artboard key={id} state={S(id)} w={1440} h={900} />).concat([<Artboard key="ud-p" state={S('unit-detail')} w={390} h={844} />]))}
      {sec('Outfitter posture (read-only)', ['picks-placed', 'unit-detail'].map((id) => <Artboard key={id} state={S(id)} w={1440} h={900} role="outfitter" />))}
    </div>
  );
}
function Prototype() {
  const [cur, setCur] = React.useState(0), [dev, setDev] = React.useState('fill'), [role, setRole] = React.useState('manager');
  const [open, setOpen] = React.useState(() => localStorage.getItem(NAV_KEY) !== 'collapsed');
  const [lint, setLint] = React.useState(null), [exp, setExp] = React.useState('');
  const stage = React.useRef(null), w = DEVICES.find((d) => d[0] === dev)[2];
  const go = (i) => { setCur((i + STATES.length) % STATES.length); setLint(null); };
  const toggle = () => { const n = !open; setOpen(n); localStorage.setItem(NAV_KEY, n ? 'open' : 'collapsed'); };
  const run = () => { const L = window.BishSRVDesignSystem_26feec.SpecLint; if (L) setLint(L.run(stage.current)); };
  return (
    <div style={{ display: 'flex', height: '100%' }}>
      {open && (
        <aside data-spec-id="sec-proto-navigator" style={{ width: 276, flexShrink: 0, background: 'var(--surface-page)', borderRight: '1px solid var(--border-ghost)', padding: 16, boxSizing: 'border-box', display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto' }}>
          <div><div className="h-lab">Layer</div><div style={{ marginTop: 6, fontFamily: 'var(--font-ui)', fontSize: 15, fontWeight: 600, color: 'var(--text-primary)' }}>MCP · Your 3 + 1</div></div>
          <div><div className="h-lab">Role</div><div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>{Object.entries(window.MCP.ROLES).map(([k, l]) => <button key={k} type="button" className="h-btn" aria-pressed={role === k} data-spec-id={`btn-action-role#${k}`} onClick={() => { setRole(k); setLint(null); }}>{l}</button>)}</div></div>
          <div><div className="h-lab">Device</div><div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>{DEVICES.map(([k, l, px]) => <button key={k} type="button" className="h-btn" aria-pressed={dev === k} data-spec-id={`btn-action-device#${k}`} onClick={() => setDev(k)}>{l}{px ? ` ${px}` : ''}</button>)}</div></div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <button type="button" className="h-btn" data-spec-id="btn-action-prev-screen" aria-label="Previous screen" onClick={() => go(cur - 1)}>‹</button>
            <span style={{ flex: 1, textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--text-body)' }}>{String(cur + 1).padStart(2, '0')} / {STATES.length}</span>
            <button type="button" className="h-btn" data-spec-id="btn-action-next-screen" aria-label="Next screen" onClick={() => go(cur + 1)}>›</button>
          </div>
          <div><div className="h-lab">Screens</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginTop: 6 }}>
              {STATES.map((s, i) => <button key={s.id} type="button" className={`h-row${s.key ? ' key' : ''}`} aria-current={i === cur} data-spec-id={`nav-screen#${s.id}`} onClick={() => go(i)}><span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, opacity: 0.7 }}>{String(i + 1).padStart(2, '0')}</span>{s.label}{s.key && <span aria-hidden="true" style={{ marginLeft: 'auto', width: 6, height: 6, borderRadius: '50%', background: 'var(--accent-gold-hi)' }} />}</button>)}
            </div>
          </div>
          <div style={{ borderTop: '1px solid var(--border-ghost)', paddingTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button type="button" className="h-btn" data-spec-id="btn-action-run-speclint" onClick={run}>Run SpecLint on this screen</button>
            <button type="button" className="h-btn" data-spec-id="btn-action-export-handoff" disabled={!!exp && !exp.startsWith('Done')} onClick={async () => { const m = await exportHandoff((t) => setExp(`Rendering ${t}…`)); const fails = m.gates.filter((g) => !g.pass).length; setExp(`Done · ${m.count} elements · ${m.gates.length - fails}/${m.gates.length} gates pass`); }}>Export handoff (manifest · requirements · Jira CSV)</button>
            {exp && <div role="status" style={{ fontFamily: 'var(--font-mono)', fontSize: 12, lineHeight: 1.5, color: 'var(--text-body)' }}>{exp}</div>}
            {lint && <div role="status" style={{ fontFamily: 'var(--font-mono)', fontSize: 12, lineHeight: 1.6, color: lint.pass ? 'var(--semantic-success)' : 'var(--semantic-danger)' }}>{lint.pass ? 'PASS' : 'FAIL'} · {Math.round(lint.coverage * 100)}% stamped<br />{lint.interactive} interactive · {lint.unstamped.length} unstamped<br />{lint.duplicates.length} dup · {lint.invalid.length} invalid · {lint.commitViolations} commit&gt;1</div>}
          </div>
        </aside>
      )}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '8px 12px' }}><button type="button" className="h-btn" data-spec-id="btn-action-toggle-navigator" aria-expanded={open} onClick={toggle}>{open ? '‹ Hide panel' : '› Show panel'}</button></div>
        <div style={{ flex: 1, minHeight: 0, display: 'flex', justifyContent: 'center', padding: '0 16px 16px', overflow: 'auto' }}>
          <div ref={stage} style={{ width: w ? w : '100%', maxWidth: w && w > 1280 ? 'none' : '100%', flexShrink: 0, height: '100%', resize: 'horizontal', overflow: 'hidden', borderRadius: 10, border: '1px solid var(--border-mid)', background: 'var(--surface-light-page)' }}>
            <window.MCPApp key={`${role}-${STATES[cur].id}-${dev}`} initial={STATES[cur].initial} role={role} />
          </div>
        </div>
      </div>
    </div>
  );
}
function Harness() {
  const qp = new URLSearchParams(location.search);
  if (qp.get('solo')) { const st = STATES.find((s) => s.id === qp.get('state')) || STATES[0], w = Number(qp.get('w') || 1440), h = Number(qp.get('h') || 900), k = Number(qp.get('scale') || 1);
    return <div style={{ width: w, height: h, transform: `scale(${k})`, transformOrigin: '0 0' }}><window.MCPApp initial={st.initial} role={qp.get('role') || 'manager'} /></div>; }
  const [mode, setMode] = React.useState('prototype');
  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, padding: 8, background: 'var(--surface-page)', borderBottom: '1px solid var(--border-ghost)' }}>
        {['canvas', 'prototype'].map((m) => <button key={m} type="button" className="h-btn" aria-pressed={mode === m} data-spec-id={`btn-action-mode#${m}`} onClick={() => setMode(m)}>{m === 'canvas' ? 'Canvas' : 'Prototype'}</button>)}
      </div>
      <div style={{ flex: 1, minHeight: 0 }}>{mode === 'canvas' ? <Canvas /> : <Prototype />}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Harness />);
</script>
</body>
</html>
