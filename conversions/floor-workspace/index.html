<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floor Workspace · converted to Bish's OS</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
html,body{margin:0;height:100%;background:var(--surface-deep);font-family:var(--font-body);}
a{color:var(--accent-gold-lo);}a:hover{color:var(--accent-gold);}
.fw-app :is(h1,h2,h3,h4,h5,h6,p,dt,dd,li){color:inherit;}
.fw-app dt{color:var(--text-light-tertiary);}
.fw{container-type:inline-size;container-name:fw;}
.fw-panel{background:var(--surface-light-card);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.fw-scroll-x{scrollbar-width:thin;scrollbar-color:var(--border-light-mid) transparent;}
.fw-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font-family:var(--font-ui);font-size:15px;font-weight:600;letter-spacing:.5px;cursor:pointer;white-space:nowrap;border:1px solid transparent;background:transparent;transition:background var(--duration-fast) var(--ease-standard);}
.fw-btn:focus-visible,.fw-icon-btn:focus-visible,.fw-menuitem:focus-visible,.fw-phase-tab:focus-visible,.fw-sched:focus-visible,.fw-rep button:focus-visible{outline:2px solid var(--accent-gold-hi);outline-offset:2px;}
.fw-btn--sm{min-height:44px;padding:0 12px;font-size:14px;}
.fw-btn--commit{background:var(--accent-gold);color:var(--brand-black);}
.fw-btn--commit:hover{background:var(--accent-gold-hi);}
.fw-btn--danger{background:var(--semantic-danger-dark);color:var(--brand-white);}
.fw-btn--action{border-color:var(--accent-gold);color:var(--accent-gold-lo);background:var(--surface-light-card);}
.fw-btn--action:hover{background:var(--surface-light-inset);}
.fw-btn--quiet{color:var(--text-light-secondary);border-color:var(--border-light-mid);}
.fw-btn--quiet:hover{background:var(--surface-light-inset);}
.fw-btn--action-dark{border-color:var(--accent-gold);color:var(--accent-gold-hi);}
.fw-btn--ghost-dark{color:var(--text-body);}
.fw-btn--action-dark:hover,.fw-btn--ghost-dark:hover{background:rgba(255,255,255,.06);}
.fw-btn:disabled{cursor:not-allowed;background:var(--surface-light-inset);color:var(--text-light-muted);border-color:var(--border-light);}
.fw-icon-btn{width:44px;height:44px;flex:0 0 44px;display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:8px;background:transparent;color:var(--text-light-secondary);cursor:pointer;}
.fw-icon-btn:hover{background:var(--surface-light-inset);}
.fw-menuitem{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--text-light-primary);font-family:var(--font-body);font-size:15px;cursor:pointer;text-align:left;}
.fw-menuitem:hover{background:var(--surface-light-inset);}
.fw-menuitem:disabled{color:var(--text-light-muted);cursor:not-allowed;}
.fw-phase-tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:none;border-bottom:3px solid transparent;background:transparent;font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.fw-sched:hover{background:var(--surface-light-raised)!important;}
.fw-input{min-height:44px;padding:10px 12px;box-sizing:border-box;border:1px solid var(--border-input-light);border-radius:8px;background:var(--surface-light-card);color:var(--text-light-primary);font-family:var(--font-body);font-size:16px;width:100%;}
.fw-input:focus{outline:none;border-color:var(--accent-gold);box-shadow:0 0 0 3px rgba(139,117,46,.15);}
.fw-check{display:flex;align-items:center;gap:12px;min-height:44px;padding:0;border:none;background:transparent;color:var(--text-light-primary);font-family:var(--font-body);font-size:15px;cursor:pointer;text-align:left;}
.fw-check-box{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--text-light-primary);display:flex;align-items:center;justify-content:center;}
.fw-check[aria-checked="true"] .fw-check-box{background:var(--text-light-primary);color:var(--brand-white);}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
/* harness */
.h-btn{min-height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--border-mid);background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;}
.h-btn[aria-pressed="true"]{border-color:var(--accent-gold-hi);color:var(--accent-gold-hi);}
.h-row{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:none;border-radius:6px;background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:14px;cursor:pointer;text-align:left;}
.h-row[aria-current="true"]{background:rgba(184,158,74,.14);color:var(--accent-gold-hi);}
.h-row.key{color:var(--text-body);}
.h-lab{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="fw-data.babel"></script>
<script type="text/babel" src="fw-screen.babel"></script>
<script type="text/babel" src="fw-overlays.babel"></script>
<script type="text/babel" src="fw-app.babel"></script>
<script type="text/babel" src="fw-requirements.babel"></script>
<script type="text/babel" src="fw-intake.babel"></script>
<script type="text/babel">
const STATES = window.FW_STATES;
const DEVICES = [['fill', 'Fill', null], ['wide', 'Wide', 1920], ['desktop', 'Desktop', 1280], ['tablet', 'Tablet', 834], ['phone', 'Phone', 390]];
const NAV_KEY = 'fw-conversion-nav';
// Step 0D handoff export: render every state × width offscreen, snapshot stamps, emit manifest + requirements skeleton.
async function exportHandoff(onProgress) {
  const L = window.BishSRVDesignSystem_26feec.SpecLint;
  const snaps = [];
  const widths = [1280, 834, 390];
  for (const role of Object.keys(window.FW.ROLES)) for (const st of STATES) for (const w of widths) {
    onProgress(`${role} · ${st.label} · ${w}`);
    const host = document.createElement('div');
    host.style.cssText = `position:fixed;left:-20000px;top:0;width:${w}px;height:900px;`;
    document.body.appendChild(host);
    const root = ReactDOM.createRoot(host);
    root.render(<window.FWApp initial={st.initial} role={role} />);
    await new Promise((r) => setTimeout(r, 450));
    snaps.push(L.snapshot(host, { state: `${role}:${st.id}`, width: w, label: `${window.FW.ROLES[role]} · ${st.label}`, status: st.status || 'mvp' }));
    root.unmount(); host.remove();
  }
  const man = L.manifest('FLOOR-WORKSPACE', snaps);
  L.download('floor-workspace.manifest.json', JSON.stringify(man, null, 2));
  L.download('floor-workspace.requirements.md', L.requirements(man, window.FW_REQ || {}), 'text/markdown');
  let precedents = [];
  try { precedents = await (await fetch('../../documents/precedents/precedents.json')).json(); } catch (e) {}
  const I = window.FW_INTAKE || {};
  const t = L.tickets(man, window.FW_REQ || {}, { intake: { rules: I.rules || {} }, ruleMap: I.ruleMap || {}, precedents, questions: I.questions || [] });
  L.download('floor-workspace.jira-tickets.csv', t.csv, 'text/csv');
  man.tickets = { stories: t.stories, blocked: t.blocked };
  return man;
}

function Artboard({ state, w, h, role = 'manager' }) {
  return (
    <figure data-spec-id={`frame-artboard#${role}-${state.id}-${w}`} style={{ margin: 0, display: 'flex', flexDirection: 'column', gap: 8, flex: '0 0 auto' }}>
      <figcaption style={{ fontFamily: 'var(--font-ui)', fontSize: 13, fontWeight: 600, letterSpacing: 0.5, color: 'var(--text-body)' }}>{state.label} · {w}{role !== 'manager' ? ` · ${window.FW.ROLES[role]}` : ''}</figcaption>
      <div style={{ width: w, height: h, borderRadius: 10, overflow: 'hidden', border: '1px solid var(--border-mid)', background: 'var(--surface-light-page)' }}><window.FWApp initial={state.initial} role={role} /></div>
    </figure>
  );
}

function Canvas() {
  const sec = (label, items) => (
    <section data-spec-id={`sec-canvas-${label.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <h2 style={{ margin: 0, fontFamily: 'var(--font-ui)', fontSize: 13, fontWeight: 700, letterSpacing: 3, textTransform: 'uppercase', color: 'var(--accent-gold-hi)' }}>{label}</h2>
      <div style={{ display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}>{items}</div>
    </section>
  );
  const S = (id) => STATES.find((s) => s.id === id);
  return (
    <div style={{ padding: 32, display: 'flex', flexDirection: 'column', gap: 40, overflow: 'auto', height: '100%', boxSizing: 'border-box' }}>
      {sec('Floor workspace · postures', [<Artboard key="w" state={S('floor')} w={1920} h={1080} />, <Artboard key="d" state={S('floor')} w={1280} h={820} />, <Artboard key="t" state={S('floor')} w={834} h={1040} />, <Artboard key="p" state={S('floor')} w={390} h={844} />])}
      {sec('Floor traffic · case overlays', ['case-menu', 'checkin', 'assign', 'move', 'note', 'left', 'phase'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} />))}
      {sec('Ups rotation · outfitter overlays', ['rep-menu', 'rep-pause', 'rep-unpause', 'rep-bench', 'rep-unbench', 'rep-move', 'chat'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} />))}
      {sec('Schedule overlays', ['appt', 'appt-checkin'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} />))}
      {sec('Receptionist posture', ['floor', 'case-menu', 'checkin', 'rep-menu', 'rep-pause'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} role="receptionist" />))}
      {sec('Phone overlays', ['case-menu', 'checkin', 'rep-menu', 'phase'].map((id) => <Artboard key={id} state={S(id)} w={390} h={844} />))}
    </div>
  );
}

function Prototype() {
  const [cur, setCur] = React.useState(0);
  const [dev, setDev] = React.useState('fill');
  const [role, setRole] = React.useState('manager');
  const [open, setOpen] = React.useState(() => localStorage.getItem(NAV_KEY) !== 'collapsed');
  const [lint, setLint] = React.useState(null);
  const [exp, setExp] = React.useState('');
  const stage = React.useRef(null);
  const w = DEVICES.find((d) => d[0] === dev)[2];
  const go = (i) => { setCur((i + STATES.length) % STATES.length); setLint(null); };
  const toggle = () => { const n = !open; setOpen(n); localStorage.setItem(NAV_KEY, n ? 'open' : 'collapsed'); };
  const run = () => { const L = window.BishSRVDesignSystem_26feec.SpecLint; if (L) setLint(L.run(stage.current)); };
  return (
    <div style={{ display: 'flex', height: '100%' }}>
      {open && (
        <aside data-spec-id="sec-proto-navigator" style={{ width: 276, flexShrink: 0, background: 'var(--surface-page)', borderRight: '1px solid var(--border-ghost)', padding: 16, boxSizing: 'border-box', display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto' }}>
          <div><div className="h-lab">Layer</div><div style={{ marginTop: 6, fontFamily: 'var(--font-ui)', fontSize: 15, fontWeight: 600, color: 'var(--text-primary)' }}>Floor Workspace</div></div>
          <div><div className="h-lab">Role</div><div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>{Object.entries(window.FW.ROLES).map(([k, l]) => <button key={k} type="button" className="h-btn" aria-pressed={role === k} data-spec-id={`btn-action-role#${k}`} onClick={() => { setRole(k); setLint(null); }}>{l}</button>)}</div></div>
          <div><div className="h-lab">Device</div><div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>{DEVICES.map(([k, l, px]) => <button key={k} type="button" className="h-btn" aria-pressed={dev === k} data-spec-id={`btn-action-device#${k}`} onClick={() => setDev(k)}>{l}{px ? ` ${px}` : ''}</button>)}</div></div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <button type="button" className="h-btn" data-spec-id="btn-action-prev-screen" aria-label="Previous screen" onClick={() => go(cur - 1)}>‹</button>
            <span style={{ flex: 1, textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--text-body)' }}>{String(cur + 1).padStart(2, '0')} / {STATES.length}</span>
            <button type="button" className="h-btn" data-spec-id="btn-action-next-screen" aria-label="Next screen" onClick={() => go(cur + 1)}>›</button>
          </div>
          <div><div className="h-lab">Screens</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginTop: 6 }}>
              {STATES.map((s, i) => (
                <button key={s.id} type="button" className={`h-row${s.key ? ' key' : ''}`} aria-current={i === cur} data-spec-id={`nav-screen#${s.id}`} onClick={() => go(i)}>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, opacity: 0.7 }}>{String(i + 1).padStart(2, '0')}</span>{s.label}
                  {s.key && <span aria-hidden="true" style={{ marginLeft: 'auto', width: 6, height: 6, borderRadius: '50%', background: 'var(--accent-gold-hi)' }} />}
                </button>
              ))}
            </div>
          </div>
          <div style={{ borderTop: '1px solid var(--border-ghost)', paddingTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button type="button" className="h-btn" data-spec-id="btn-action-run-speclint" onClick={run}>Run SpecLint on this screen</button>
            <button type="button" className="h-btn" data-spec-id="btn-action-export-handoff" disabled={!!exp && !exp.startsWith('Done')} onClick={async () => { const m = await exportHandoff((t) => setExp(`Rendering ${t}…`)); const fails = m.gates.filter((g) => !g.pass).length; setExp(`Done · ${m.count} elements · ${m.gates.length - fails}/${m.gates.length} gates pass · ${m.tickets ? m.tickets.stories + ' stories, ' + m.tickets.blocked + ' blocked' : ''}`); }}>Export handoff (manifest · requirements · Jira CSV)</button>
            {exp && <div role="status" style={{ fontFamily: 'var(--font-mono)', fontSize: 12, lineHeight: 1.5, color: 'var(--text-body)' }}>{exp}</div>}
            {lint && <div role="status" style={{ fontFamily: 'var(--font-mono)', fontSize: 12, lineHeight: 1.6, color: lint.pass ? 'var(--semantic-success)' : 'var(--semantic-danger)' }}>{lint.pass ? 'PASS' : 'FAIL'} · {Math.round(lint.coverage * 100)}% stamped<br />{lint.interactive} interactive · {lint.unstamped.length} unstamped<br />{lint.duplicates.length} dup · {lint.invalid.length} invalid · {lint.commitViolations} commit&gt;1</div>}
          </div>
        </aside>
      )}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '8px 12px' }}><button type="button" className="h-btn" data-spec-id="btn-action-toggle-navigator" aria-expanded={open} onClick={toggle}>{open ? '‹ Hide panel' : '› Show panel'}</button></div>
        <div style={{ flex: 1, minHeight: 0, display: 'flex', justifyContent: 'center', padding: '0 16px 16px', overflow: 'auto' }}>
          <div ref={stage} style={{ width: w ? w : '100%', maxWidth: w && w > 1280 ? 'none' : '100%', flexShrink: 0, height: '100%', resize: 'horizontal', overflow: 'hidden', borderRadius: 10, border: '1px solid var(--border-mid)', background: 'var(--surface-light-page)' }}>
            <window.FWApp key={`${role}-${STATES[cur].id}-${dev}`} initial={STATES[cur].initial} role={role} />
          </div>
        </div>
      </div>
    </div>
  );
}

function Harness() {
  const [mode, setMode] = React.useState('prototype');
  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, padding: 8, background: 'var(--surface-page)', borderBottom: '1px solid var(--border-ghost)' }}>
        {['canvas', 'prototype'].map((m) => <button key={m} type="button" className="h-btn" aria-pressed={mode === m} data-spec-id={`btn-action-mode#${m}`} onClick={() => setMode(m)}>{m === 'canvas' ? 'Canvas' : 'Prototype'}</button>)}
      </div>
      <div style={{ flex: 1, minHeight: 0 }}>{mode === 'canvas' ? <Canvas /> : <Prototype />}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Harness />);
</script>
</body>
</html>
