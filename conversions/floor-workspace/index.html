<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floor Workspace · converted to Bish's OS</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
html,body{margin:0;height:100%;background:var(--surface-deep);font-family:var(--font-body);}
a{color:var(--accent-gold-lo);}a:hover{color:var(--accent-gold);}
.fw-app :is(h1,h2,h3,h4,h5,h6,p,dt,dd,li){color:inherit;}
.fw-app dt{color:var(--text-light-tertiary);}
.fw{container-type:inline-size;container-name:fw;}
.fw-panel{background:var(--surface-light-card);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.fw-scroll-x{scrollbar-width:thin;scrollbar-color:var(--border-light-mid) transparent;}
.fw-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font-family:var(--font-ui);font-size:15px;font-weight:600;letter-spacing:.5px;cursor:pointer;white-space:nowrap;border:1px solid transparent;background:transparent;transition:background var(--duration-fast) var(--ease-standard);}
.fw-btn:focus-visible,.fw-icon-btn:focus-visible,.fw-menuitem:focus-visible,.fw-phase-tab:focus-visible,.fw-sched:focus-visible,.fw-rep button:focus-visible{outline:2px solid var(--accent-gold-hi);outline-offset:2px;}
.fw-btn--sm{min-height:44px;padding:0 12px;font-size:14px;}
.fw-btn--commit{background:var(--accent-gold-hi);color:var(--brand-black);}
.fw-btn--commit:hover{background:var(--accent-gold);}
.fw-btn--danger{background:var(--semantic-danger-dark);color:var(--brand-white);}
.fw-btn--action{border-color:var(--accent-gold);color:var(--accent-gold-lo);background:var(--surface-light-card);}
.fw-btn--action:hover{background:var(--surface-light-inset);}
.fw-btn--quiet{color:var(--text-light-secondary);border-color:var(--border-light-mid);}
.fw-btn--quiet:hover{background:var(--surface-light-inset);}
.fw-btn--action-dark{border-color:var(--accent-gold);color:var(--accent-gold-hi);}
.fw-btn--ghost-dark{color:var(--text-body);}
.fw-btn--action-dark:hover,.fw-btn--ghost-dark:hover{background:rgba(255,255,255,.06);}
.fw-btn:disabled{cursor:not-allowed;background:var(--surface-light-inset);color:var(--text-light-muted);border-color:var(--border-light);}
.fw-icon-btn{width:44px;height:44px;flex:0 0 44px;display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:8px;background:transparent;color:var(--text-light-secondary);cursor:pointer;}
.fw-icon-btn:hover{background:var(--surface-light-inset);}
.fw-menuitem{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--text-light-primary);font-family:var(--font-body);font-size:15px;cursor:pointer;text-align:left;}
.fw-menuitem:hover{background:var(--surface-light-inset);}
.fw-menuitem:disabled{color:var(--text-light-muted);cursor:not-allowed;}
.fw-phase-tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:none;border-bottom:3px solid transparent;background:transparent;font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.fw-sched:hover{background:var(--surface-light-raised)!important;}
.fw-input{min-height:44px;padding:10px 12px;box-sizing:border-box;border:1px solid var(--border-input-light);border-radius:8px;background:var(--surface-light-card);color:var(--text-light-primary);font-family:var(--font-body);font-size:16px;width:100%;}
.fw-input:focus{outline:none;border-color:var(--accent-gold);box-shadow:0 0 0 3px rgba(139,117,46,.15);}
.fw-check{display:flex;align-items:center;gap:12px;min-height:44px;padding:0;border:none;background:transparent;color:var(--text-light-primary);font-family:var(--font-body);font-size:15px;cursor:pointer;text-align:left;}
.fw-check-box{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--text-light-primary);display:flex;align-items:center;justify-content:center;}
.fw-check[aria-checked="true"] .fw-check-box{background:var(--text-light-primary);color:var(--brand-white);}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
.fw-app{container-type:inline-size;container-name:app;}
.fw-app :is(.fw-cc,.fw-hub,.fw-pd,.fw-table,.fw-ci,.fw-rs,.fw-alert){color:var(--text-light-primary);}
.fw-app .fw-thead{color:var(--text-light-secondary);}
.fw-app dt.fw-cc-lbl{color:var(--text-light-tertiary);}
.fw-app dt.fw-cc-lbl.caps{color:var(--text-light-secondary);}
.fw-app dd.fw-cc-val{color:var(--text-light-primary);}
.fw-app dd.fw-cc-val.phase{color:var(--accent-olive);}
.fw-app .fw-pop{color:var(--text-primary);}
.fw-cc-empty{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1.5px dashed var(--semantic-danger-dark);background:var(--semantic-danger-light);color:var(--semantic-danger-dark);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:700;}
/* phase column */
/* customer card + phase alert: shared DS components (ui_kits/floor) */
.fw-pcol{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface-light-page);border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-light);}
.fw-pcol.is-over{box-shadow:inset 0 0 0 2px var(--accent-gold-hi);}
.fw-pcol-head{display:flex;align-items:center;gap:6px;padding:0 4px 0 6px;min-height:48px;background:var(--surface-card,#1F2424);color:var(--text-primary);}
.fw-pcol-head.tone-danger{box-shadow:inset 0 -3px 0 var(--semantic-danger-dark);}
.fw-pcol-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;border:none;background:transparent;color:inherit;cursor:pointer;border-radius:6px;font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;text-align:left;}
.fw-pcol-title:hover{background:rgba(255,255,255,.06);}
.fw-pcol-title:disabled{cursor:default;background:transparent;}
.fw-dia{width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg);border-radius:1px;}
.fw-pcol-count{font-family:var(--font-mono);font-size:12px;font-weight:700;min-width:28px;text-align:center;padding:2px 8px;border-radius:999px;border:1px solid var(--border-mid);color:var(--text-primary);}
.fw-pcol-head .fw-icon-btn{color:var(--text-body);}
.fw-pcol-head .fw-icon-btn:hover{background:rgba(255,255,255,.08);}
.fw-pcol-body{flex:1;min-height:0;overflow-y:auto;margin:0;padding:12px 10px;display:flex;flex-direction:column;gap:12px;list-style:none;}
/* dark popover (case + rep) */
.fw-pop{position:absolute;z-index:86;background:linear-gradient(180deg,#1C2222,#0F1313);color:var(--text-primary);border:1px solid var(--border-mid);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;}
.fw-pop-row{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--border-ghost);font-size:14px;}
.fw-pop-k{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);}
.fw-pop-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:8px;border:1px solid var(--border-mid);background:rgba(255,255,255,.04);color:var(--text-primary);font-family:var(--font-ui);font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;}
.fw-pop-btn:hover{background:rgba(255,255,255,.09);}
.fw-pop-btn.action{border-color:var(--accent-gold);color:var(--accent-gold-hi);}
.fw-pop-btn.danger{color:var(--semantic-danger);border-color:rgba(255,135,135,.4);}
.fw-pop-btn:disabled{opacity:.45;cursor:not-allowed;}
/* light stats popover (rep) */
.fw-rs{position:absolute;z-index:86;background:var(--surface-light-card);color:var(--text-light-primary);border:1px solid var(--border-light);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;}
.fw-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.fw-seg button{min-height:44px;border-radius:999px;border:1px solid var(--border-light-mid);background:var(--surface-light-raised);font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-light-secondary);cursor:pointer;}
.fw-seg button[aria-selected="true"]{background:var(--text-light-primary);border-color:var(--text-light-primary);color:var(--brand-white);}
.fw-rs-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0;padding:14px 0;border-top:1px solid var(--border-light);border-bottom:1px solid var(--border-light);}
.fw-rs-stats>div{text-align:center;padding:0 6px;}
.fw-rs-stats>div+div{border-left:1px solid var(--border-light);}
.fw-rs-stats dt{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-secondary)!important;}
.fw-rs-stats dd{margin:2px 0 0;font-family:var(--font-display);font-size:clamp(34px,6cqi,44px);line-height:1;color:var(--text-light-primary);}
.fw-rs-stats small{display:block;font-family:var(--font-ui);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-light-tertiary);}
.fw-bar{display:grid;grid-template-columns:80px minmax(0,1fr) 56px;align-items:center;gap:12px;}
.fw-bar-k{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-secondary);}
.fw-bar-t{height:8px;border-radius:999px;background:var(--surface-light-inset);overflow:hidden;}
.fw-bar-t span{display:block;height:100%;border-radius:999px;background:var(--text-light-primary);}
.fw-bar-v{font-family:var(--font-mono);font-size:13px;font-weight:700;text-align:right;}
.fw-btn--danger-tint{background:var(--semantic-danger-light);color:var(--semantic-danger-dark);border-color:rgba(176,37,37,.3);}
.fw-btn--danger-tint:hover{background:var(--semantic-danger-dark);color:var(--brand-white);}
.fw-btn--ink{background:var(--text-light-primary);color:var(--brand-white);}
.fw-btn--ink:hover{background:var(--text-light-secondary);}
.fw-btn--display{font-family:var(--font-display);font-size:20px;font-weight:400;letter-spacing:1.5px;}
/* ── Phase Action Hub (MCP / Worksheet) ── */
.fw-hub-back{position:absolute;inset:0;z-index:90;background:rgba(2,0,0,.55);display:flex;padding:18px;box-sizing:border-box;}
.fw-hub{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-light-page);border-radius:14px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5);}
.fw-hub-bar{display:flex;align-items:center;gap:12px;background:#141414;padding:0 8px 0 16px;min-height:56px;flex:none;}
.fw-hub-t{font-family:var(--font-display);font-size:24px;letter-spacing:2.5px;color:var(--brand-white);line-height:1;}
.fw-hub-pill{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-light-primary);background:var(--brand-cream);border-radius:999px;padding:2px 11px;}
.fw-hub-sub{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);}
.fw-hub-bar .fw-icon-btn{margin-left:auto;color:var(--brand-cream);border:1px solid var(--border-mid);}
.fw-hub-bar .fw-icon-btn:hover{background:rgba(255,255,255,.1);}
.fw-hub-main{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;}
.fw-hub-rail{display:flex;flex-direction:column;background:var(--surface-light-inset);border-bottom:1px solid var(--border-light);}
.fw-hub-rail-h{margin:14px 16px 0;padding:10px;border-radius:6px;background:var(--semantic-danger-dark);color:var(--brand-white);text-align:center;font-family:var(--font-display);font-size:19px;letter-spacing:2.5px;}
.fw-hub-rail-b{display:flex;gap:12px;padding:14px 16px 16px;overflow-x:auto;list-style:none;margin:0;}
.fw-hub-rail-b>li{flex:0 0 min(300px,82%);}
.fw-hub-right{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;min-width:0;}
.fw-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0;}
.fw-kpi{background:#141414;border:1px solid transparent;border-radius:8px;padding:10px 14px 12px;}
.fw-kpi.hero{border-color:var(--accent-gold);}
.fw-kpi dt{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--brand-cream)!important;}
.fw-kpi.hero dt{color:var(--accent-gold-hi)!important;}
.fw-kpi.bad dt{color:var(--semantic-danger)!important;}
.fw-kpi dt .fw-dia{margin-left:auto;background:var(--accent-gold-hi);}
.fw-kpi.bad dt .fw-dia{background:var(--semantic-danger);}
.fw-kpi dd{margin:4px 0 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.fw-kpi b{font-family:var(--font-display);font-weight:400;font-size:32px;letter-spacing:1px;line-height:1;color:var(--brand-white);}
.fw-kpi small{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
.fw-hub-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.fw-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 320px;}
.fw-chip{min-height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--border-input-light);background:var(--surface-light-card);font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--text-light-secondary);cursor:pointer;}
.fw-chip:hover{border-color:var(--text-light-primary);color:var(--text-light-primary);}
.fw-chip[aria-pressed="true"]{background:var(--text-light-primary);border-color:var(--text-light-primary);color:var(--brand-white);}
.fw-field{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid var(--border-input-light);border-radius:8px;background:var(--surface-light-card);color:var(--text-light-tertiary);}
.fw-field:focus-within{border-color:var(--accent-gold);box-shadow:0 0 0 3px rgba(139,117,46,.15);}
.fw-field input,.fw-field select{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--font-body);font-size:15px;color:var(--text-light-primary);height:42px;}
.fw-table{background:var(--surface-light-card);border:1px solid var(--border-light);border-radius:8px;overflow:hidden;list-style:none;margin:0;padding:0;}
.fw-trow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 14px;border-bottom:1px solid var(--border-light);}
.fw-trow:last-child{border-bottom:none;}
.fw-thead{display:none;}
.fw-tcust{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--text-light-primary);}
.fw-twhen{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-light-tertiary);margin-top:2px;font-weight:600;}
.fw-tof{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--text-light-primary);font-weight:600;}
.fw-tof small{display:block;font-size:12px;font-weight:400;color:var(--text-light-tertiary);}
.fw-av{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:var(--text-light-primary);color:var(--brand-white);font-family:var(--font-mono);font-size:11px;font-weight:700;overflow:hidden;}
.fw-av img{width:100%;height:100%;object-fit:cover;}
.fw-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-family:var(--font-body);font-size:12px;font-weight:700;}
.fw-tag.danger{background:var(--semantic-danger-light);color:var(--semantic-danger-dark);}
.fw-tag.warning{background:var(--semantic-warning-light);color:#7A4C00;}
.fw-tag.neutral{background:var(--surface-light-inset);color:var(--text-light-secondary);}
.fw-tag.info{background:var(--semantic-info-light);color:var(--semantic-info-dark);}
.fw-tag.success{background:var(--semantic-success-light);color:var(--semantic-success-dark);}
.fw-tstep{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;}
.fw-own{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid var(--border-light-mid);background:var(--surface-light-inset);color:var(--text-light-secondary);}
.fw-own.manager{background:#1F2424;border-color:#1F2424;color:var(--surface-light-page);}
.fw-own.customer{background:var(--semantic-info-light);border-color:rgba(24,100,171,.3);color:var(--semantic-info-dark);}
.fw-own.outfitter{background:var(--brand-cream);border-color:rgba(94,79,31,.3);color:var(--accent-gold-lo);}
.fw-own.done{background:var(--semantic-success-light);border-color:rgba(27,122,46,.3);color:var(--semantic-success-dark);}
.fw-tnext{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--text-light-primary);}
.fw-cue{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--semantic-danger-light);color:var(--semantic-danger-dark);}
.fw-dots{display:flex;gap:5px;}
.fw-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:700;background:var(--surface-light-inset);color:var(--text-light-tertiary);}
.fw-dot.on{background:var(--semantic-info-dark);color:var(--brand-white);}
.fw-dot.done{background:var(--semantic-success-dark);color:var(--brand-white);}
@container app (min-width: 760px){
.fw-trow{grid-template-columns:1.1fr 1.1fr .8fr 1.5fr;align-items:center;gap:12px;}
.fw-thead{display:grid;background:var(--surface-light-inset);padding:10px 14px;font-family:var(--font-display);font-size:15px;letter-spacing:2px;color:var(--text-light-secondary);}
.fw-tstep{flex-direction:column;}
}
@container app (min-width: 1024px){
.fw-hub-main{display:grid;grid-template-columns:clamp(300px,26%,360px) minmax(0,1fr);overflow:hidden;}
.fw-hub-rail{border-bottom:none;border-right:1px solid var(--border-light);min-height:0;}
.fw-hub-rail-b{flex-direction:column;overflow-x:visible;overflow-y:auto;flex:1;min-height:0;}
.fw-hub-rail-b>li{flex:none;}
.fw-hub-right{overflow-y:auto;min-height:0;}
}
@container app (max-width: 640px){.fw-hub-back{padding:0;}.fw-hub{border-radius:0;}}
.fw-alerts{position:absolute;right:20px;bottom:20px;z-index:84;display:flex;flex-direction:column;gap:14px;width:min(420px,calc(100% - 32px));pointer-events:none;}
@container app (max-width: 640px){.fw-alerts{right:16px;bottom:96px;}}
@keyframes fwPulse{0%,100%{box-shadow:0 0 0 0 rgba(176,37,37,.42)}50%{box-shadow:0 0 0 8px rgba(176,37,37,0)}}
@keyframes fwSlide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.fw-alert-p+.fw-alert-p{border-top:1px solid var(--border-light);}
/* ── check-in (Module 05) ── */
.fw-ci{width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;background:var(--surface-light-page);border-radius:16px;box-shadow:var(--shadow-xl);overflow:hidden;}
.fw-ci-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px 16px;margin:0;list-style:none;background:var(--surface-light-inset);border-top:1px solid var(--border-light);border-bottom:1px solid var(--border-light);}
.fw-ci-steps li{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:6px;font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-muted);}
.fw-ci-steps li[aria-current="step"]{background:var(--border-light);color:var(--text-light-primary);}
.fw-ci-steps li.done{color:var(--text-light-primary);}
.fw-ci-num{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;background:var(--border-light-mid);color:var(--text-light-tertiary);}
.fw-ci-steps li[aria-current="step"] .fw-ci-num{background:var(--text-light-primary);color:var(--brand-white);}
.fw-ci-steps li.done .fw-ci-num{background:var(--semantic-success-dark);color:var(--brand-white);}
.fw-ci-lbl{font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light-secondary);}
.fw-tiles{display:grid;gap:10px;}
.fw-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:12px;border:2px solid var(--border-light-mid);background:var(--surface-light-card);cursor:pointer;color:var(--text-light-primary);text-align:center;}
.fw-tile:hover{border-color:var(--text-light-secondary);}
.fw-tile[aria-checked="true"]{border-color:var(--text-light-primary);background:var(--surface-light-inset);box-shadow:0 6px 14px -6px rgba(0,0,0,.25);}
.fw-tile-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--text-light-primary);color:var(--brand-white);display:grid;place-items:center;}
.fw-tile-l{font-family:var(--font-ui);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.fw-tile-d{font-size:12px;color:var(--text-light-tertiary);}
.fw-tiles.party{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.fw-tiles.party .fw-tile-art{width:100%;height:84px;border-radius:8px;background:var(--surface-light-raised);border:1px solid var(--border-light);display:flex;align-items:flex-end;justify-content:center;}
.fw-tiles.units{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));}
.fw-tiles.units img{width:100%;height:56px;object-fit:contain;}
.fw-tiles.outs{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));}
.fw-tiles.outs .fw-tile-l{font-size:13px;}
.fw-tile.is-up .fw-tile-d{color:var(--text-light-primary);font-weight:700;}
.fw-wear{display:flex;flex-wrap:wrap;gap:8px;}
.fw-wear button{width:44px;height:44px;border-radius:8px;border:1px solid var(--border-input-light);background:var(--surface-light-card);color:var(--text-light-secondary);display:grid;place-items:center;cursor:pointer;position:relative;}
.fw-wear button[aria-pressed="true"]{border-color:var(--text-light-primary);box-shadow:0 0 0 2px var(--text-light-primary);}
.fw-swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.fw-swatches button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-light-mid);cursor:pointer;}
.fw-swatches button[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface-light-page),0 0 0 4px var(--text-light-primary);}
.fw-match{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border-input-light);background:var(--surface-light-card);cursor:pointer;text-align:left;color:var(--text-light-primary);}
.fw-match[aria-checked="true"]{border-color:var(--text-light-primary);background:var(--surface-light-inset);}
/* phase detail modal */
.fw-pd{width:100%;max-width:1100px;max-height:100%;display:flex;flex-direction:column;background:var(--surface-light-page);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.5);overflow:hidden;}
.fw-pd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:0;background:#141414;}
.fw-pd-stats>div{padding:12px 16px;border-right:1px solid var(--border-ghost);}
.fw-pd-stats dd{margin:0;font-family:var(--font-display);font-size:34px;line-height:1;color:var(--brand-white);}
.fw-pd-stats dt{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)!important;margin-top:4px;}
.fw-sec-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:0 0 10px;font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-light-primary);}
.fw-sec-h small{font-family:var(--font-body);font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--text-light-tertiary);}
/* harness */
.h-btn{min-height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--border-mid);background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;}
.h-btn[aria-pressed="true"]{border-color:var(--accent-gold-hi);color:var(--accent-gold-hi);}
.h-row{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:none;border-radius:6px;background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:14px;cursor:pointer;text-align:left;}
.h-row[aria-current="true"]{background:rgba(184,158,74,.14);color:var(--accent-gold-hi);}
.h-row.key{color:var(--text-body);}
.h-lab{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script>window.FW_RES=function(p){if(!p)return p;var e=document.querySelector('#fw-res img[data-res="'+p+'"]');return e?e.getAttribute('src'):p;};</script>

<script type="text/babel">
const STATES = window.FW_STATES;
const DEVICES = [['fill', 'Fill', null], ['wide', 'Wide', 1920], ['desktop', 'Desktop', 1280], ['tablet', 'Tablet', 834], ['phone', 'Phone', 390]];
const NAV_KEY = 'fw-conversion-nav';
// Step 0D handoff export: render every state × width offscreen, snapshot stamps, emit manifest + requirements skeleton.
async function exportHandoff(onProgress) {
  const L = window.BishSRVDesignSystem_26feec.SpecLint;
  const snaps = [];
  const widths = [1280, 834, 390];
  for (const role of Object.keys(window.FW.ROLES)) for (const st of STATES) for (const w of widths) {
    onProgress(`${role} · ${st.label} · ${w}`);
    const host = document.createElement('div');
    host.style.cssText = `position:fixed;left:-20000px;top:0;width:${w}px;height:900px;`;
    document.body.appendChild(host);
    const root = ReactDOM.createRoot(host);
    root.render(<window.FWApp initial={st.initial} role={role} />);
    await new Promise((r) => setTimeout(r, 450));
    snaps.push(L.snapshot(host, { state: `${role}:${st.id}`, width: w, label: `${window.FW.ROLES[role]} · ${st.label}`, status: st.status || 'mvp' }));
    root.unmount(); host.remove();
  }
  const man = L.manifest('FLOOR-WORKSPACE', snaps);
  L.download('floor-workspace.manifest.json', JSON.stringify(man, null, 2));
  L.download('floor-workspace.requirements.md', L.requirements(man, window.FW_REQ || {}), 'text/markdown');
  let precedents = [];
  try { precedents = await (await fetch('../../documents/precedents/precedents.json')).json(); } catch (e) {}
  const I = window.FW_INTAKE || {};
  const t = L.tickets(man, window.FW_REQ || {}, { intake: { rules: I.rules || {} }, ruleMap: I.ruleMap || {}, precedents, questions: I.questions || [] });
  L.download('floor-workspace.jira-tickets.csv', t.csv, 'text/csv');
  man.tickets = { stories: t.stories, blocked: t.blocked };
  return man;
}

function Artboard({ state, w, h, role = 'manager' }) {
  return (
    <figure data-spec-id={`frame-artboard#${role}-${state.id}-${w}`} style={{ margin: 0, display: 'flex', flexDirection: 'column', gap: 8, flex: '0 0 auto' }}>
      <figcaption style={{ fontFamily: 'var(--font-ui)', fontSize: 13, fontWeight: 600, letterSpacing: 0.5, color: 'var(--text-body)' }}>{state.label} · {w}{role !== 'manager' ? ` · ${window.FW.ROLES[role]}` : ''}</figcaption>
      <div style={{ width: w, height: h, borderRadius: 10, overflow: 'hidden', border: '1px solid var(--border-mid)', background: 'var(--surface-light-page)' }}><window.FWApp initial={state.initial} role={role} /></div>
    </figure>
  );
}

function Canvas() {
  const sec = (label, items) => (
    <section data-spec-id={`sec-canvas-${label.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <h2 style={{ margin: 0, fontFamily: 'var(--font-ui)', fontSize: 13, fontWeight: 700, letterSpacing: 3, textTransform: 'uppercase', color: 'var(--accent-gold-hi)' }}>{label}</h2>
      <div style={{ display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}>{items}</div>
    </section>
  );
  const S = (id) => STATES.find((s) => s.id === id);
  return (
    <div style={{ padding: 32, display: 'flex', flexDirection: 'column', gap: 40, overflow: 'auto', height: '100%', boxSizing: 'border-box' }}>
      {sec('Floor workspace · postures', [<Artboard key="w" state={S('floor')} w={1920} h={1080} />, <Artboard key="d" state={S('floor')} w={1280} h={820} />, <Artboard key="t" state={S('floor')} w={834} h={1040} />, <Artboard key="p" state={S('floor')} w={390} h={844} />])}
      {sec('Floor traffic · case overlays', ['case-menu', 'checkin', 'checkin-match', 'checkin-assign', 'assign', 'move', 'note', 'left', 'phase'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={id.startsWith('checkin') ? 1100 : 820} />))}
      {sec('Phase action hub & alerts', ['hub-mcp', 'hub-worksheet', 'phase-alert'].map((id) => <Artboard key={id} state={S(id)} w={1440} h={900} />).concat([<Artboard key="hm-t" state={S('hub-mcp')} w={834} h={1100} />, <Artboard key="hm-p" state={S('hub-mcp')} w={390} h={844} />, <Artboard key="al-p" state={S('phase-alert')} w={390} h={844} />]))}
      {sec('Ups rotation · outfitter overlays', ['rep-menu', 'rep-pause', 'rep-unpause', 'rep-bench', 'rep-unbench', 'rep-move', 'chat'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} />))}
      {sec('Global search & link preview', ['search', 'link-preview'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} />))}
      {sec('Schedule overlays', ['appt', 'appt-checkin'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} />))}
      {sec('Receptionist posture', ['floor', 'case-menu', 'checkin', 'rep-menu', 'rep-pause'].map((id) => <Artboard key={id} state={S(id)} w={1280} h={820} role="receptionist" />))}
      {sec('Phone overlays', ['case-menu', 'checkin-assign', 'rep-menu', 'phase'].map((id) => <Artboard key={id} state={S(id)} w={390} h={844} />))}
    </div>
  );
}

function Prototype() {
  const [cur, setCur] = React.useState(0);
  const [dev, setDev] = React.useState('fill');
  const [role, setRole] = React.useState('manager');
  const [open, setOpen] = React.useState(() => localStorage.getItem(NAV_KEY) !== 'collapsed');
  const [lint, setLint] = React.useState(null);
  const [exp, setExp] = React.useState('');
  const stage = React.useRef(null);
  const w = DEVICES.find((d) => d[0] === dev)[2];
  const go = (i) => { setCur((i + STATES.length) % STATES.length); setLint(null); };
  const toggle = () => { const n = !open; setOpen(n); localStorage.setItem(NAV_KEY, n ? 'open' : 'collapsed'); };
  const run = () => { const L = window.BishSRVDesignSystem_26feec.SpecLint; if (L) setLint(L.run(stage.current)); };
  return (
    <div style={{ display: 'flex', height: '100%' }}>
      {open && (
        <aside data-spec-id="sec-proto-navigator" style={{ width: 276, flexShrink: 0, background: 'var(--surface-page)', borderRight: '1px solid var(--border-ghost)', padding: 16, boxSizing: 'border-box', display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto' }}>
          <div><div className="h-lab">Layer</div><div style={{ marginTop: 6, fontFamily: 'var(--font-ui)', fontSize: 15, fontWeight: 600, color: 'var(--text-primary)' }}>Floor Workspace</div></div>
          <div><div className="h-lab">Role</div><div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>{Object.entries(window.FW.ROLES).map(([k, l]) => <button key={k} type="button" className="h-btn" aria-pressed={role === k} data-spec-id={`btn-action-role#${k}`} onClick={() => { setRole(k); setLint(null); }}>{l}</button>)}</div></div>
          <div><div className="h-lab">Device</div><div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>{DEVICES.map(([k, l, px]) => <button key={k} type="button" className="h-btn" aria-pressed={dev === k} data-spec-id={`btn-action-device#${k}`} onClick={() => setDev(k)}>{l}{px ? ` ${px}` : ''}</button>)}</div></div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <button type="button" className="h-btn" data-spec-id="btn-action-prev-screen" aria-label="Previous screen" onClick={() => go(cur - 1)}>‹</button>
            <span style={{ flex: 1, textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--text-body)' }}>{String(cur + 1).padStart(2, '0')} / {STATES.length}</span>
            <button type="button" className="h-btn" data-spec-id="btn-action-next-screen" aria-label="Next screen" onClick={() => go(cur + 1)}>›</button>
          </div>
          <div><div className="h-lab">Screens</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginTop: 6 }}>
              {STATES.map((s, i) => (
                <button key={s.id} type="button" className={`h-row${s.key ? ' key' : ''}`} aria-current={i === cur} data-spec-id={`nav-screen#${s.id}`} onClick={() => go(i)}>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, opacity: 0.7 }}>{String(i + 1).padStart(2, '0')}</span>{s.label}
                  {s.key && <span aria-hidden="true" style={{ marginLeft: 'auto', width: 6, height: 6, borderRadius: '50%', background: 'var(--accent-gold-hi)' }} />}
                </button>
              ))}
            </div>
          </div>
          <div style={{ borderTop: '1px solid var(--border-ghost)', paddingTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button type="button" className="h-btn" data-spec-id="btn-action-run-speclint" onClick={run}>Run SpecLint on this screen</button>
            <button type="button" className="h-btn" data-spec-id="btn-action-export-handoff" disabled={!!exp && !exp.startsWith('Done')} onClick={async () => { const m = await exportHandoff((t) => setExp(`Rendering ${t}…`)); const fails = m.gates.filter((g) => !g.pass).length; setExp(`Done · ${m.count} elements · ${m.gates.length - fails}/${m.gates.length} gates pass · ${m.tickets ? m.tickets.stories + ' stories, ' + m.tickets.blocked + ' blocked' : ''}`); }}>Export handoff (manifest · requirements · Jira CSV)</button>
            {exp && <div role="status" style={{ fontFamily: 'var(--font-mono)', fontSize: 12, lineHeight: 1.5, color: 'var(--text-body)' }}>{exp}</div>}
            {lint && <div role="status" style={{ fontFamily: 'var(--font-mono)', fontSize: 12, lineHeight: 1.6, color: lint.pass ? 'var(--semantic-success)' : 'var(--semantic-danger)' }}>{lint.pass ? 'PASS' : 'FAIL'} · {Math.round(lint.coverage * 100)}% stamped<br />{lint.interactive} interactive · {lint.unstamped.length} unstamped<br />{lint.duplicates.length} dup · {lint.invalid.length} invalid · {lint.commitViolations} commit&gt;1</div>}
          </div>
        </aside>
      )}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '8px 12px' }}><button type="button" className="h-btn" data-spec-id="btn-action-toggle-navigator" aria-expanded={open} onClick={toggle}>{open ? '‹ Hide panel' : '› Show panel'}</button></div>
        <div style={{ flex: 1, minHeight: 0, display: 'flex', justifyContent: 'center', padding: '0 16px 16px', overflow: 'auto' }}>
          <div ref={stage} style={{ width: w ? w : '100%', maxWidth: w && w > 1280 ? 'none' : '100%', flexShrink: 0, height: '100%', resize: 'horizontal', overflow: 'hidden', borderRadius: 10, border: '1px solid var(--border-mid)', background: 'var(--surface-light-page)' }}>
            <window.FWApp key={`${role}-${STATES[cur].id}-${dev}`} initial={STATES[cur].initial} role={role} />
          </div>
        </div>
      </div>
    </div>
  );
}

function Harness() {
  const [mode, setMode] = React.useState('prototype');
  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, padding: 8, background: 'var(--surface-page)', borderBottom: '1px solid var(--border-ghost)' }}>
        {['canvas', 'prototype'].map((m) => <button key={m} type="button" className="h-btn" aria-pressed={mode === m} data-spec-id={`btn-action-mode#${m}`} onClick={() => setMode(m)}>{m === 'canvas' ? 'Canvas' : 'Prototype'}</button>)}
      </div>
      <div style={{ flex: 1, minHeight: 0 }}>{mode === 'canvas' ? <Canvas /> : <Prototype />}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Harness />);
</script>
