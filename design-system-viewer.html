<!DOCTYPE html>
<!-- @dsCard group="Brand" name="design-system-viewer" subtitle="Toggle Dark / Light / Split / All + filter by category" viewport="1600x1200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexus · Design System Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A09; --bg-raised:#141410; --bg-card:#1C1C17;
    --border:rgba(207,177,89,0.18); --border-strong:rgba(207,177,89,0.35);
    --text:#EDE6D3; --text-mute:#A39A82; --text-dim:#6B6454;
    --gold:#CFB159; --gold-warm:#B89A3F;
    --bg-light:#F7F6F1; --bg-light-raised:#F0ECDD;
    --text-light:#0A0A09; --text-light-mute:#3D3D38;
    --border-light:rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Source Sans 3',sans-serif;font-size:14px;line-height:1.55;min-height:100vh;}
  body.theme-light{background:var(--bg-light);color:var(--text-light);}
  body.theme-split{background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 50%,var(--bg-light) 50%,var(--bg-light) 100%);}

  /* ======= HEADER ======= */
  .hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,9,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:18px 28px;}
  body.theme-light .hdr{background:rgba(247,246,241,0.95);border-bottom-color:var(--border-light);}
  body.theme-split .hdr{background:rgba(10,10,9,0.95);border-bottom-color:var(--border);}
  .hdr-row{display:flex;align-items:center;gap:20px;max-width:1600px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:36px;height:32px;background:var(--gold);clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);}
  .brand-text{display:flex;flex-direction:column;line-height:1;}
  .brand-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--gold);}
  body.theme-light .brand-name{color:var(--gold-warm);}
  .brand-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-mute);margin-top:4px;font-weight:600;}
  body.theme-light .brand-sub{color:var(--text-light-mute);}

  .toggle-group{margin-left:auto;display:flex;background:rgba(207,177,89,0.08);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;}
  body.theme-light .toggle-group{background:rgba(139,117,46,0.08);border-color:rgba(139,117,46,0.25);}
  .toggle-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border:none;background:transparent;color:var(--text-mute);cursor:pointer;border-radius:6px;transition:all 0.15s ease;display:flex;align-items:center;gap:6px;}
  body.theme-light .toggle-btn{color:var(--text-light-mute);}
  .toggle-btn:hover{color:var(--text);}
  body.theme-light .toggle-btn:hover{color:var(--text-light);}
  .toggle-btn.active{background:var(--gold);color:#0A0A09;}
  body.theme-light .toggle-btn.active{background:var(--gold-warm);color:#FFF;}
  .toggle-btn svg{width:12px;height:12px;}

  .filter-chips{display:flex;gap:6px;margin-left:16px;flex-wrap:wrap;}
  .chip{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;padding:6px 12px;border:1px solid var(--border);border-radius:9999px;background:transparent;color:var(--text-mute);cursor:pointer;transition:all 0.15s ease;}
  body.theme-light .chip{border-color:rgba(139,117,46,0.25);color:var(--text-light-mute);}
  .chip:hover{border-color:var(--gold);color:var(--text);}
  body.theme-light .chip:hover{border-color:var(--gold-warm);color:var(--text-light);}
  .chip.active{background:rgba(207,177,89,0.15);border-color:var(--gold);color:var(--gold);}
  body.theme-light .chip.active{background:rgba(139,117,46,0.12);border-color:var(--gold-warm);color:var(--gold-warm);}

  .count-pill{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-left:10px;}
  body.theme-light .count-pill{color:var(--text-light-mute);}

  /* ======= BANNER ======= */
  .banner{max-width:1600px;margin:0 auto;padding:20px 28px 0;display:flex;align-items:center;gap:14px;}
  .banner-text{font-family:'Source Sans 3',sans-serif;font-size:13px;color:var(--text-mute);line-height:1.5;max-width:820px;}
  body.theme-light .banner-text{color:var(--text-light-mute);}
  .banner-text b{color:var(--text);}
  body.theme-light .banner-text b{color:var(--text-light);}

  /* ======= SECTION ======= */
  main{max-width:1600px;margin:0 auto;padding:8px 28px 60px;}
  .section{margin-top:36px;}
  .section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  body.theme-light .section-head{border-bottom-color:var(--border-light);}
  .section-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--text);line-height:1;}
  body.theme-light .section-name{color:var(--text-light);}
  .section-count{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
  body.theme-light .section-count{color:var(--gold-warm);}
  .section-desc{font-family:'Source Sans 3',sans-serif;font-size:12.5px;color:var(--text-mute);margin-left:auto;font-style:italic;}
  body.theme-light .section-desc{color:var(--text-light-mute);}

  /* ======= GRID ======= */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:20px;}

  /* ======= CARD ======= */
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color 0.2s ease, transform 0.15s ease;display:flex;flex-direction:column;}
  body.theme-light .card{background:#FFFFFF;border-color:var(--border-light);}
  .card.theme-card-light{background:#FFFFFF;border-color:var(--border-light);}
  .card:hover{border-color:var(--border-strong);}
  body.theme-light .card:hover{border-color:rgba(139,117,46,0.4);}
  .card.theme-card-light:hover{border-color:rgba(139,117,46,0.4);}
  .card-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-raised);}
  body.theme-light .card-hd{background:var(--bg-light-raised);border-bottom-color:var(--border-light);}
  .card.theme-card-light .card-hd{background:var(--bg-light-raised);border-bottom-color:var(--border-light);}
  .card-meta{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .card-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.5px;color:var(--text);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  body.theme-light .card-title{color:var(--text-light);}
  .card.theme-card-light .card-title{color:var(--text-light);}
  .card-sub{font-family:'Source Sans 3',sans-serif;font-size:11.5px;color:var(--text-mute);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  body.theme-light .card-sub{color:var(--text-light-mute);}
  .card.theme-card-light .card-sub{color:var(--text-light-mute);}
  .card-tag{font-family:'Barlow Condensed',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 9px;border-radius:4px;flex-shrink:0;}
  .card-tag.dark{background:rgba(20,20,16,0.9);color:#CFB159;border:1px solid rgba(207,177,89,0.3);}
  .card-tag.light{background:rgba(255,245,217,0.9);color:#8B752E;border:1px solid rgba(139,117,46,0.25);}
  .card-tag.both{background:rgba(24,100,171,0.15);color:#4A90D9;border:1px solid rgba(74,144,217,0.3);}
  .card-body{padding:0;background:var(--bg);flex:1;min-height:0;}
  .card.theme-card-light .card-body{background:#F7F6F1;}
  body.theme-light .card-body{background:#F7F6F1;}
  .card-frame{width:100%;border:0;display:block;background:transparent;}

  /* ======= EMPTY STATE ======= */
  .empty{text-align:center;padding:80px 20px;color:var(--text-mute);}
  body.theme-light .empty{color:var(--text-light-mute);}
  .empty-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:8px;}
  .empty-sub{font-family:'Source Sans 3',sans-serif;font-size:13px;}

  @media (max-width: 760px){
    .hdr-row{flex-wrap:wrap;gap:12px;}
    .filter-chips{margin-left:0;width:100%;}
    .toggle-group{margin-left:0;}
  }
</style>
</head>
<body class="theme-dark">
  <header class="hdr">
    <div class="hdr-row">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <div class="brand-name">Nexus</div>
          <div class="brand-sub">Design System Viewer</div>
        </div>
      </div>

      <div class="filter-chips" id="filter-chips">
        <!-- populated by JS -->
      </div>

      <div class="toggle-group" role="tablist" aria-label="Theme">
        <button class="toggle-btn" data-theme="dark" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          Dark
        </button>
        <button class="toggle-btn" data-theme="light" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
          Light
        </button>
        <button class="toggle-btn" data-theme="split" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0 0 20V2z"/><path d="M12 2a10 10 0 0 1 0 20V2z" fill="currentColor" opacity="0.4"/></svg>
          Split
        </button>
        <button class="toggle-btn active" data-theme="all" aria-pressed="true">
          All
        </button>
      </div>
    </div>
  </header>

  <div class="banner">
    <div class="banner-text">
      <b>Viewing mode:</b> toggle between Dark, Light, Split (dark top / light bottom), and All. Category chips filter by section. Dark/Light tags on each card show which theme the card documents.
    </div>
  </div>

  <main id="root"></main>

<script>
// ===================== MANIFEST =====================
// Every preview card in the project, tagged with:
//   group:   Brand | Type | Colors | Spacing | Components | Patterns | Modules | Motion
//   theme:   dark | light | both  (which surface this card documents)
//   h:       iframe height

const CARDS = [
  // BRAND
  { file:'brand-logos.html',          title:'Logo Kit',               sub:'Black · Gold · White · Tagline variants',     group:'Brand',      theme:'both', h:520 },
  { file:'brand-wayfinder.html',      title:'Wayfinder',              sub:'Signature brand shape · arrow primitive',      group:'Brand',      theme:'both', h:420 },
  { file:'brand-wayfinder-usage.html',title:'Wayfinder · Usage',      sub:'Do / don\u2019t placement rules',              group:'Brand',      theme:'both', h:460 },
  { file:'brand-hexagon.html',        title:'Hexagon',                sub:'Container primitive · icon badge',             group:'Brand',      theme:'both', h:420 },
  { file:'brand-accent-colors.html',  title:'Brand Accent Colors',    sub:'Red · Yellow · Light Blue · Blue',              group:'Brand',      theme:'both', h:440 },
  { file:'voice-content.html',        title:'Voice & Content',        sub:'Irreverent & Nostalgic \u00b7 do / don\u2019t',  group:'Brand',      theme:'both', h:440 },

  // TYPE
  { file:'type-display.html',         title:'Display Type',           sub:'Bebas Neue \u00b7 headlines',                 group:'Type',       theme:'both', h:440 },
  { file:'type-ui.html',              title:'UI Type',                sub:'Barlow Condensed \u00b7 nav, labels, chrome', group:'Type',       theme:'both', h:440 },
  { file:'type-body-mono.html',       title:'Body & Mono',            sub:'Source Sans 3 \u00b7 JetBrains Mono',         group:'Type',       theme:'both', h:460 },
  { file:'type-substitutions.html',   title:'Font Substitutions',     sub:'Sucrose\u2192Bebas \u00b7 Geo\u2192Barlow',   group:'Type',       theme:'both', h:680 },

  // COLORS
  { file:'colors-brand.html',         title:'Brand Colors',           sub:'Gold \u00b7 Black \u00b7 Green \u00b7 Cream', group:'Colors',     theme:'both', h:360 },
  { file:'colors-semantic.html',      title:'Semantic Colors',        sub:'Success \u00b7 Warning \u00b7 Error \u00b7 Info', group:'Colors', theme:'both', h:320 },
  { file:'colors-accent-scale.html',  title:'Accent Scale (Gold)',    sub:'50 \u2192 900 token steps',                   group:'Colors',     theme:'both', h:300 },
  { file:'colors-surfaces-dark.html', title:'Surfaces \u00b7 Dark',   sub:'Background layers for dark theme',            group:'Colors',     theme:'dark', h:360 },
  { file:'colors-surfaces-light.html',title:'Surfaces \u00b7 Light',  sub:'Background layers for light theme',           group:'Colors',     theme:'light',h:360 },
  { file:'colors-text-light.html',    title:'Text Colors \u00b7 Light', sub:'Primary / mute / dim on light surfaces',    group:'Colors',     theme:'light',h:340 },

  // SPACING
  { file:'spacing-scale.html',        title:'Spacing Scale',          sub:'4px base unit \u00b7 0 \u2192 96',             group:'Spacing',    theme:'both', h:340 },
  { file:'radii.html',                title:'Radii',                  sub:'Border radius tokens',                         group:'Spacing',    theme:'both', h:260 },
  { file:'shadows.html',              title:'Shadows',                sub:'Elevation tokens',                             group:'Spacing',    theme:'both', h:320 },

  // COMPONENTS · DARK
  { file:'components-buttons.html',   title:'Buttons \u00b7 Dark',    sub:'Primary \u00b7 Secondary \u00b7 Tertiary',     group:'Components', theme:'dark', h:380 },
  { file:'components-card.html',      title:'Cards \u00b7 Dark',      sub:'Container \u00b7 stat \u00b7 unit row',        group:'Components', theme:'dark', h:420 },
  { file:'components-badges.html',    title:'Badges',                 sub:'Status \u00b7 count \u00b7 tag',               group:'Components', theme:'dark', h:320 },
  { file:'components-inputs.html',    title:'Inputs',                 sub:'Text \u00b7 select \u00b7 search',             group:'Components', theme:'dark', h:380 },
  // COMPONENTS · LIGHT
  { file:'components-buttons-light.html', title:'Buttons \u00b7 Light', sub:'Primary \u00b7 Secondary \u00b7 Tertiary',   group:'Components', theme:'light', h:380 },
  { file:'components-card-light.html', title:'Cards \u00b7 Light',    sub:'Container \u00b7 stat \u00b7 row',              group:'Components', theme:'light', h:420 },

  // MODULES (Go Play)
  { file:'module-summary-card.html',  title:'Module \u00b7 Summary Card', sub:'Tier 1 KPI tile',                          group:'Modules',    theme:'both', h:320 },
  { file:'module-alert.html',         title:'Module \u00b7 Alert',    sub:'Exception banner',                             group:'Modules',    theme:'both', h:280 },
  { file:'module-queue.html',         title:'Module \u00b7 Queue',    sub:'Tier 2 operational list',                      group:'Modules',    theme:'both', h:460 },
  { file:'module-trend.html',         title:'Module \u00b7 Trend',    sub:'Sparkline chart tile',                         group:'Modules',    theme:'both', h:320 },
  { file:'module-comparison.html',    title:'Module \u00b7 Comparison', sub:'Side-by-side metric comparison',             group:'Modules',    theme:'both', h:380 },
  { file:'module-timeline.html',      title:'Module \u00b7 Timeline', sub:'Sequential event track',                       group:'Modules',    theme:'both', h:360 },

  // PATTERNS
  { file:'pattern-data-states.html',  title:'Pattern \u00b7 Data States', sub:'Loading \u00b7 empty \u00b7 error \u00b7 partial \u00b7 stale \u00b7 permission', group:'Patterns', theme:'both', h:420 },
  { file:'pattern-disclosure.html',   title:'Pattern \u00b7 Progressive Disclosure', sub:'Tabs \u00b7 accordion \u00b7 drawer \u00b7 modal', group:'Patterns', theme:'both', h:300 },
  { file:'board-grammar-worked-example.html', title:'Pattern \u00b7 Board Grammar', sub:'Trigger-chain row grammar \u00b7 worked example', group:'Patterns', theme:'dark', h:560 },
  { file:'pattern-three-tier.html',   title:'Pattern \u00b7 Three-Tier Architecture', sub:'Summary \u2192 operational \u2192 detail', group:'Patterns', theme:'both', h:320 },

  // MOTION
  { file:'motion.html',               title:'Motion',                 sub:'Duration \u00b7 easing \u00b7 transitions',    group:'Motion',     theme:'both', h:400 },
  { file:'themes-overview.html',      title:'Themes Overview',        sub:'Dark \u00b7 light parallel system',            group:'Brand',      theme:'both', h:420 },
];

const GROUPS = ['Brand','Type','Colors','Spacing','Components','Modules','Patterns','Motion'];
const GROUP_DESCS = {
  Brand: 'Identity primitives, shape system, voice.',
  Type: 'Families, scales, pairings, and substitution rationale.',
  Colors: 'Brand, semantic, surface layers.',
  Spacing: 'Scale, radii, elevation.',
  Components: 'Interactive UI atoms, dark and light.',
  Modules: 'Go-Play composition units (Tier 1 / Tier 2 tiles).',
  Patterns: 'Architectural rules and state coverage.',
  Motion: 'Duration, easing, and transition tokens.'
};

// ===================== STATE =====================
const state = {
  theme: 'all',      // 'dark' | 'light' | 'split' | 'all'
  group: 'all',      // 'all' | one of GROUPS
};

// ===================== RENDER =====================
function render(){
  // body class
  document.body.className = 'theme-' + state.theme;

  // active theme button
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    const active = btn.dataset.theme === state.theme;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });

  // active chip
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.group === state.group);
  });

  // filter cards
  const visible = CARDS.filter(c => {
    // theme filter: 'all' shows everything; 'split' shows everything too (user wants visual split).
    // 'dark' shows theme:dark and theme:both; 'light' shows theme:light and theme:both.
    if(state.theme === 'dark')  return c.theme === 'dark'  || c.theme === 'both';
    if(state.theme === 'light') return c.theme === 'light' || c.theme === 'both';
    return true;
  }).filter(c => state.group === 'all' ? true : c.group === state.group);

  // group them
  const byGroup = {};
  visible.forEach(c => { (byGroup[c.group] ||= []).push(c); });

  const root = document.getElementById('root');
  if(!visible.length){
    root.innerHTML = '<div class="empty"><div class="empty-title">Nothing to show</div><div class="empty-sub">Try a different theme or category.</div></div>';
    return;
  }

  const orderedGroups = GROUPS.filter(g => byGroup[g]);
  root.innerHTML = orderedGroups.map(g => `
    <section class="section">
      <div class="section-head">
        <div class="section-name">${g}</div>
        <div class="section-count">${byGroup[g].length} ${byGroup[g].length === 1 ? 'card' : 'cards'}</div>
        <div class="section-desc">${GROUP_DESCS[g] || ''}</div>
      </div>
      <div class="grid">
        ${byGroup[g].map(renderCard).join('')}
      </div>
    </section>
  `).join('');

  // update total count pill
  const total = document.getElementById('count-pill');
  if(total) total.textContent = `${visible.length} of ${CARDS.length}`;
}

function renderCard(c){
  const tag = c.theme === 'dark' ? '<span class="card-tag dark">Dark</span>'
            : c.theme === 'light' ? '<span class="card-tag light">Light</span>'
            : '<span class="card-tag both">Both</span>';
  // In split mode, force card background to match its theme tag.
  let cardClass = 'card';
  if(state.theme === 'split' || state.theme === 'all'){
    if(c.theme === 'light') cardClass += ' theme-card-light';
  }
  return `
    <article class="${cardClass}">
      <header class="card-hd">
        <div class="card-meta">
          <div class="card-title">${c.title}</div>
          <div class="card-sub">${c.sub}</div>
        </div>
        ${tag}
      </header>
      <div class="card-body">
        <iframe class="card-frame" src="preview/${c.file}" loading="lazy" style="height:${c.h}px;" title="${c.title}"></iframe>
      </div>
    </article>
  `;
}

// ===================== EVENTS =====================
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.theme = btn.dataset.theme;
    localStorage.setItem('nexus-dsv-theme', state.theme);
    render();
  });
});

function buildChips(){
  const container = document.getElementById('filter-chips');
  const chips = [
    `<button class="chip active" data-group="all">All <span class="count-pill" id="count-pill">${CARDS.length} cards</span></button>`,
    ...GROUPS.map(g => {
      const n = CARDS.filter(c => c.group === g).length;
      return `<button class="chip" data-group="${g}">${g} \u00b7 ${n}</button>`;
    })
  ];
  container.innerHTML = chips.join('');
  container.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      state.group = c.dataset.group;
      localStorage.setItem('nexus-dsv-group', state.group);
      render();
    });
  });
}

// ===================== INIT =====================
(function init(){
  const savedTheme = localStorage.getItem('nexus-dsv-theme');
  const savedGroup = localStorage.getItem('nexus-dsv-group');
  if(savedTheme && ['dark','light','split','all'].includes(savedTheme)) state.theme = savedTheme;
  if(savedGroup && (savedGroup === 'all' || GROUPS.includes(savedGroup))) state.group = savedGroup;
  buildChips();
  render();
})();
</script>
</body>
