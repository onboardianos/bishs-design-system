<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Design-extract snapshot viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:bebasNeue;src:local("Bebas Neue");}
html,body{margin:0;background:#2a2a2a;font-family:"Source Sans 3",system-ui,sans-serif;color:#eee}
a{color:#c9a93d}a:hover{color:#e7ddb4}
#bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#111;border-bottom:1px solid #333;font-size:13px}
#bar select,#bar button{min-height:32px;background:#1c1c1c;color:#eee;border:1px solid #444;border-radius:6px;padding:0 8px;font:inherit}
#meta{color:#a2a59c;font-family:"JetBrains Mono",monospace;font-size:12px}
#stage{padding:16px;overflow:auto}
#frame{transform-origin:0 0;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#status{padding:40px;text-align:center;color:#a2a59c}
</style>
</head>
<body>
<div id="bar">
<select id="file" aria-label="Extract file"></select>
<select id="snap" aria-label="Snapshot"></select>
<select id="portal" aria-label="Captured overlay"></select>
<label>Zoom <select id="zoom"><option value="fit">Fit</option><option>1</option><option>0.75</option><option>0.5</option></select></label>
<span id="meta"></span>
</div>
<div id="stage"><div id="status">Loading…</div><div id="host"></div></div>
<script>
// Rebuilds a design-extract snapshot (structure tree + computed styles) as static DOM. Read-only reference; not a build.
const FONT = { bebasNeue: '"Bebas Neue"', barlowCondensed: '"Barlow Condensed"', sourceSans3: '"Source Sans 3"', jetBrainsMono: '"JetBrains Mono"', geistSans: 'system-ui', geistMono: 'ui-monospace' };
const fixFont = (v) => v.replace(/"?(bebasNeue|barlowCondensed|sourceSans3|jetBrainsMono|geistSans|geistMono)( Fallback)?"?/g, (m, f) => FONT[f]);
const qs = new URLSearchParams(location.search);
let data = null, cur = null;
const $ = (id) => document.getElementById(id);
async function loadIndex() {
  const idx = await (await fetch('../../uploads/screen-index.json')).json();
  const opts = idx.screens.flatMap((s) => s.files.map((f) => ({ file: f.file, label: `${f.file}  (${f.snapshots})` })));
  $('file').innerHTML = opts.map((o) => `<option value="${o.file}">${o.label}</option>`).join('');
  const f = qs.get('file'); $('file').selectedIndex = Math.max(0, opts.findIndex((o) => o.file === f));
  await loadFile();
}
async function loadFile() {
  $('status').textContent = 'Loading ' + $('file').value + '…'; $('host').innerHTML = '';
  data = await (await fetch('../../uploads/' + $('file').value)).json();
  const ids = Object.keys(data.snapshots);
  $('snap').innerHTML = ids.map((id, i) => { const s = data.snapshots[id]; return `<option value="${id}">${String(i + 1).padStart(2, '0')} · ${s.label || s.title || ''} · ${s.viewport.join('×')}${s.expanded ? ' · expanded' : ''}</option>`; }).join('');
  const want = qs.get('snap'); $('snap').value = want && data.snapshots[want] ? want : ids[0];
  fillPortals();
  render();
}
function build(n, snap) {
  if (n.hidden && !(n.children && n.children.length)) return null;
  if (n.svg && snap.svgs[n.svg]) {
    const t = document.createElement('template'); t.innerHTML = snap.svgs[n.svg].outerHTML; const el = t.content.firstElementChild;
    if (el && n.s && snap.styles[n.s]) applyStyle(el, snap.styles[n.s]);
    return el;
  }
  const el = document.createElement(n.tag === 'body' ? 'div' : n.tag);
  if (n.attrs) for (const [k, v] of Object.entries(n.attrs)) { if (/^on/i.test(k)) continue; try { el.setAttribute(k, v); } catch (e) {} }
  if (n.s && snap.styles[n.s]) applyStyle(el, snap.styles[n.s]);
  if (n.img) { const im = snap.images && snap.images.find((i) => i.src === n.img || i.original === n.img) ; el.src = (im && im.src) || n.img; }
  if (n.tag === 'img' && !el.src && snap.images) { /* fallback */ }
  if (n.text) el.appendChild(document.createTextNode(n.text));
  (n.children || []).forEach((c) => { const k = typeof c === 'string' ? document.createTextNode(c) : build(c, snap); if (k) el.appendChild(k); });
  return el;
}
function applyStyle(el, st) {
  for (const [k, v] of Object.entries(st)) {
    if (k === 'transition-property' || k === 'transition-duration' || k === 'cursor') continue;
    el.style.setProperty(k, k === 'font-family' ? fixFont(v) : v);
  }
}
function render() {
  cur = data.snapshots[$('snap').value];
  const [w, h] = cur.viewport;
  $('meta').textContent = `${cur.route}  ·  ${w}×${h}  ·  doc ${Math.round(cur.documentHeight)}px  ·  ${cur.capturedAt}`;
  const root = build(cur.structure, cur);
  const frame = document.createElement('div'); frame.id = 'frame';
  frame.style.cssText = `width:${w}px;height:${Math.max(h, cur.documentHeight || h)}px;position:relative;overflow:hidden`;
  if (root) { root.style.width = w + 'px'; frame.appendChild(root); }
  const pt = $('portal').value;
  if (pt !== '' && cur.portals[pt]) {
    const ps = { styles: cur.portalStyles, svgs: cur.portalSvgs, images: cur.images };
    const layer = document.createElement('div'); layer.style.cssText = 'position:absolute;inset:0;z-index:999;';
    cur.portals[pt].content.forEach((n) => { const el = build(n, ps); if (!el) return; el.style.position = 'absolute'; el.style.transform = 'none'; el.style.left = n.rect[0] + 'px'; el.style.top = n.rect[1] + 'px'; layer.appendChild(el); });
    frame.appendChild(layer);
  }
  $('host').innerHTML = ''; $('host').appendChild(frame); $('status').textContent = '';
  const z = $('zoom').value, sc = z === 'fit' ? Math.min(1, ($('stage').clientWidth - 32) / w) : +z;
  frame.style.transform = `scale(${sc})`; $('host').style.height = (frame.offsetHeight * sc) + 'px'; $('host').style.width = (w * sc) + 'px';
  history.replaceState(null, '', `?file=${encodeURIComponent($('file').value)}&snap=${encodeURIComponent($('snap').value)}${$('portal').value !== '' ? '&portal=' + $('portal').value : ''}`);
}
$('file').onchange = () => { qs.delete('snap'); loadFile(); };
$('snap').onchange = () => { fillPortals(); render(); }; $('portal').onchange = render; $('zoom').onchange = render; window.onresize = () => cur && render();
function fillPortals() { const s = data.snapshots[$('snap').value]; const ps = s.portals || []; $('portal').innerHTML = `<option value="">Overlays: none (${ps.length} captured)</option>` + ps.map((p, i) => `<option value="${i}">${p.kind} · ${String(p.trigger || '').slice(0, 40)}</option>`).join(''); const q = qs.get('portal'); $('portal').value = q && ps[q] ? q : ''; qs.delete('portal'); }
loadIndex().catch((e) => { $('status').textContent = 'Failed: ' + e.message; });
</script>
</body>
</html>
